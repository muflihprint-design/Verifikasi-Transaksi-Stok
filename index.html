<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kasir & Arus Kas Modern</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-active { color: #2563eb !important; }
    .nav-active i { transform: translateY(-2px); transition: transform 0.2s; }
    .page-transition { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    #modal-backdrop { transition: opacity 0.3s ease; }
    #modal-content { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }

    .item-checkbox:checked + .checkbox-visual {
      background-color: #2563eb;
      border-color: #2563eb;
    }
    .item-checkbox:checked + .checkbox-visual i {
      display: block;
    }
  </style>
</head>
<body class="max-w-md mx-auto min-h-screen shadow-2xl relative bg-white pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-100 p-4">
        <div class="flex justify-between items-center">
            <div>
                <h1 id="page-title" class="text-xl font-black text-slate-800 tracking-tight text-blue-600 uppercase">BERANDA</h1>
                <p id="current-date" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Memuat tanggal...</p>
            </div>
            <div class="flex gap-2">
                <div id="sync-indicator" class="hidden"><div class="loader"></div></div>
                <button onclick="fetchData()" class="p-2.5 bg-slate-100 rounded-2xl text-slate-600 hover:bg-slate-200 transition-colors">
                    <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <main id="app-content" class="p-4 space-y-6 page-transition">
        <!-- Tab: Beranda -->
        <div id="dashboard-container" class="space-y-4">
            <div class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-[32px] p-6 text-white shadow-xl relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full -mr-16 -mt-16 blur-2xl"></div>
                <p class="text-[10px] font-bold opacity-80 uppercase tracking-[0.2em] mb-1">Total Saldo Tunai</p>
                <h2 id="total-saldo" class="text-3xl font-black tracking-tight mb-4">Rp 0</h2>
                <div class="flex gap-4">
                    <div class="flex-1 bg-white/10 backdrop-blur-sm rounded-2xl p-3">
                        <p class="text-[9px] font-bold opacity-70 uppercase mb-1">Masuk</p>
                        <p id="total-masuk" class="text-sm font-bold">Rp 0</p>
                    </div>
                    <div class="flex-1 bg-white/10 backdrop-blur-sm rounded-2xl p-3">
                        <p class="text-[9px] font-bold opacity-70 uppercase mb-1">Keluar</p>
                        <p id="total-keluar" class="text-sm font-bold text-red-200">Rp 0</p>
                    </div>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4 mt-6">
                <button onclick="changeTab('barang_masuk')" class="flex flex-col items-center gap-2 p-5 bg-orange-50 rounded-[28px] border border-orange-100 group active:scale-95 transition-all">
                    <div class="p-3 bg-orange-500 rounded-2xl text-white shadow-lg shadow-orange-200 group-hover:rotate-12 transition-transform">
                        <i data-lucide="package-check" class="w-6 h-6"></i>
                    </div>
                    <span class="text-[10px] font-black text-orange-700 uppercase tracking-wider">Cek Stok Masuk</span>
                </button>
                <button onclick="changeTab('riwayat')" class="flex flex-col items-center gap-2 p-5 bg-blue-50 rounded-[28px] border border-blue-100 group active:scale-95 transition-all">
                    <div class="p-3 bg-blue-600 rounded-2xl text-white shadow-lg shadow-blue-200 group-hover:-rotate-12 transition-transform">
                        <i data-lucide="history" class="w-6 h-6"></i>
                    </div>
                    <span class="text-[10px] font-black text-blue-700 uppercase tracking-wider">Riwayat Kas</span>
                </button>
            </div>
        </div>

        <!-- Wrapper Pencarian Khusus Stok Masuk -->
        <div id="search-wrapper" class="hidden space-y-4">
            <div class="relative group">
                <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-blue-500 transition-colors">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </div>
                <input 
                    type="text" 
                    id="bm-search-input"
                    oninput="handleBMSearch(this.value)"
                    placeholder="Cari nama barang..." 
                    class="w-full bg-slate-100 border-none rounded-2xl py-4 pl-12 pr-4 text-xs font-bold text-slate-800 placeholder:text-slate-400 focus:ring-2 focus:ring-blue-500/20 transition-all outline-none"
                >
            </div>
            <!-- Filter Tabs Tetap Di Sini Agar Tidak Terender Ulang -->
            <div class="flex gap-1 bg-slate-100 p-1 rounded-2xl" id="filter-tabs-wrapper">
                <button onclick="setBMFilter('belum')" id="btn-f-belum" class="flex-1 py-2 text-[10px] font-bold rounded-xl transition-all bg-white shadow-sm text-blue-600 uppercase">Pending</button>
                <button onclick="setBMFilter('selesai')" id="btn-f-selesai" class="flex-1 py-2 text-[10px] font-bold rounded-xl transition-all text-slate-500 uppercase">Selesai</button>
                <button onclick="setBMFilter('semua')" id="btn-f-semua" class="flex-1 py-2 text-[10px] font-bold rounded-xl transition-all text-slate-500 uppercase">Semua</button>
            </div>
        </div>

        <!-- List Container (Hanya untuk daftar kartu) -->
        <div id="list-container" class="hidden space-y-4"></div>
    </main>

    <!-- Modal -->
    <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div id="modal-backdrop" onclick="closeModal()" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm opacity-0"></div>
        <div id="modal-content" class="relative bg-white w-full max-w-md rounded-t-[32px] sm:rounded-[32px] shadow-2xl transform translate-y-full overflow-hidden flex flex-col max-h-[95vh]">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 id="modal-title" class="font-black text-slate-800 uppercase tracking-tight text-xs">Detail Verifikasi</h3>
                <button onclick="closeModal()" class="p-2 bg-white rounded-full shadow-sm hover:bg-slate-100 text-slate-400 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto space-y-4 flex-1"></div>
            
            <div id="modal-footer" class="p-4 bg-white border-t border-slate-100 hidden space-y-3">
                <div id="bonus-alert" class="hidden p-3 bg-amber-50 border border-amber-200 rounded-2xl flex items-start gap-3">
                    <div class="p-1.5 bg-amber-500 rounded-xl text-white shrink-0">
                        <i data-lucide="gift" class="w-4 h-4"></i>
                    </div>
                    <div>
                        <p class="text-[10px] font-black text-amber-800 uppercase tracking-tight">Kelebihan Barang (Bonus)</p>
                        <p id="bonus-text" class="text-[9px] text-amber-700 leading-tight"></p>
                    </div>
                </div>

                <div id="shortage-option" class="p-3 bg-indigo-50 border border-indigo-100 rounded-2xl flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                        <i data-lucide="check-circle" class="w-5 h-5 text-indigo-600"></i>
                        <div>
                            <p class="text-[10px] text-indigo-800 font-bold uppercase tracking-tight">Kelebihan Barang?</p>
                            <p class="text-[9px] text-indigo-600 leading-tight">Aktifkan dan anggap bonus</p>
                        </div>
                    </div>
                    <button onclick="toggleShortageMode()" id="btn-shortage-mode" class="px-4 py-2 bg-indigo-600 text-white text-[10px] font-black uppercase rounded-xl shadow-md active:scale-95 transition-all">Lunasi Sisa</button>
                </div>
                
                <button id="btn-save-verification" onclick="saveVerifiedItems()" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-black uppercase tracking-widest text-xs shadow-lg shadow-blue-200 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    Simpan Verifikasi
                </button>
            </div>
        </div>
    </div>

    <!-- Navigasi Bawah -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-lg border-t border-slate-100 px-6 py-4 z-40">
        <div class="flex justify-between items-center max-w-xs mx-auto">
            <button onclick="changeTab('beranda')" id="nav-beranda" class="flex flex-col items-center gap-1 text-slate-400 nav-active">
                <i data-lucide="layout-grid" class="w-6 h-6"></i>
                <span class="text-[10px] font-bold uppercase tracking-wider">Mulai</span>
            </button>
            <button onclick="changeTab('riwayat')" id="nav-riwayat" class="flex flex-col items-center gap-1 text-slate-400">
                <i data-lucide="history" class="w-6 h-6"></i>
                <span class="text-[10px] font-bold uppercase tracking-wider">Riwayat</span>
            </button>
            <button onclick="changeTab('barang_masuk')" id="nav-barang_masuk" class="flex flex-col items-center gap-1 text-slate-400">
                <i data-lucide="package-search" class="w-6 h-6"></i>
                <span class="text-[10px] font-bold uppercase tracking-wider">Cek Stok</span>
            </button>
        </div>
    </nav>

    <script>
        const SUPABASE_URL = "https://zqxeoveanevsvynptckm.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxeGVvdmVhbmV2c3Z5bnB0Y2ttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyNzUzODEsImV4cCI6MjA4OTg1MTM4MX0.eeIaytpW1wtWPJc2FbhufkDkhONUt9yypTZU4dTVmsM";
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRvAQXltAVp8lnrXXVVPJr1hYEi8cAJrqz182qT23eaiI8t-MoBrEtE7bAAJqKEyKKTig4hpA9DNuQB/pub?gid=2057149863&single=true&output=csv";
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZNmMPh3BM6IU9529KSCzxhEMhZlfvwCmjcl8B2aiyFO_JGsNrf2NJGsWEXtDm6wlWaQ/exec"; 
        const SPREADSHEET_ID = "15qzJ3txkTBYNFc09RWUAr5ZKUa_lQcOHKCThwJ3r0Fk";

        let allTransactions = [];
        let sheetPurchases = [];
        let verifiedItems = [];
        let currentTab = 'beranda';
        let currentBMFilter = 'belum';
        let bmSearchQuery = "";
        let selectedItemsForSync = [];
        let baseRemainingQty = 0; 
        let currentTransactionContext = null;
        let isShortageMode = false;

        document.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').innerText = now.toLocaleDateString('id-ID', options);
            fetchData();
        });

        async function fetchData() {
            const indicator = document.getElementById('sync-indicator');
            indicator.classList.remove('hidden');
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/riwayat?select=*`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                const data = await response.json();
                if (Array.isArray(data)) allTransactions = data.sort((a, b) => (b.id || 0) - (a.id || 0));

                const csvRes = await fetch(CSV_URL);
                const csvText = await csvRes.text();
                sheetPurchases = parseCSV(csvText);

                await fetchVerifiedItems();

                updateDashboard();
                refreshCurrentView();
            } catch (err) { 
                console.error("Gagal Ambil Data:", err); 
            } finally { 
                indicator.classList.add('hidden'); 
            }
        }

        async function fetchVerifiedItems() {
            try {
                const res = await fetch(`${APPS_SCRIPT_URL}?spreadsheet_id=${SPREADSHEET_ID}`);
                const result = await res.json();
                verifiedItems = result.data || [];
            } catch (e) {
                verifiedItems = [];
            }
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/);
            if (lines.length < 2) return [];
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                if (!line.trim()) continue;
                const row = [];
                let inQuotes = false, currentValue = '';
                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"') {
                        if (inQuotes && line[j+1] === '"') { currentValue += '"'; j++; }
                        else inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) { row.push(currentValue.trim()); currentValue = ''; }
                    else currentValue += char;
                }
                row.push(currentValue.trim());
                if (row[3] && row[3].toLowerCase() === 'pembelian') {
                    result.push({ no_transaksi: row[0], waktu: row[1], keterangan: row[4], keluar: row[6], itemRaw: row[10] || "[]" });
                }
            }
            return result;
        }

        function refreshCurrentView() {
            ['beranda', 'riwayat', 'barang_masuk'].forEach(t => {
                const nav = document.getElementById('nav-' + t);
                if (nav) nav.classList.toggle('nav-active', currentTab === t);
            });
            if (currentTab === 'riwayat') renderRiwayat();
            else if (currentTab === 'barang_masuk') renderBarangMasuk();
            lucide.createIcons();
        }

        function updateDashboard() {
            let masuk = 0, keluar = 0;
            allTransactions.forEach(t => { masuk += Number(t.masuk || 0); keluar += Number(t.keluar || 0); });
            document.getElementById('total-masuk').innerText = formatRupiah(masuk);
            document.getElementById('total-keluar').innerText = formatRupiah(keluar);
            document.getElementById('total-saldo').innerText = formatRupiah(masuk - keluar);
        }

        function changeTab(tab) {
            currentTab = tab;
            let title = tab.replace('_', ' ').toUpperCase();
            if (title === "RIWAYAT") title = "RIWAYAT KAS";
            if (title === "BARANG MASUK") title = "STOK MASUK";
            
            document.getElementById('page-title').innerText = title;
            document.getElementById('dashboard-container').classList.toggle('hidden', tab !== 'beranda');
            document.getElementById('search-wrapper').classList.toggle('hidden', tab !== 'barang_masuk');
            document.getElementById('list-container').classList.toggle('hidden', tab === 'beranda');
            
            refreshCurrentView();
        }

        function handleBMSearch(val) {
            bmSearchQuery = val.toLowerCase();
            renderBarangMasuk();
        }

        function setBMFilter(v) {
            currentBMFilter = v;
            // Update UI Tab Filter secara manual agar tidak render ulang input
            ['belum', 'selesai', 'semua'].forEach(f => {
                const btn = document.getElementById(`btn-f-${f}`);
                if (f === v) {
                    btn.classList.add('bg-white', 'shadow-sm', 'text-blue-600');
                    btn.classList.remove('text-slate-500');
                } else {
                    btn.classList.remove('bg-white', 'shadow-sm', 'text-blue-600');
                    btn.classList.add('text-slate-500');
                }
            });
            renderBarangMasuk();
        }

        function renderRiwayat() {
            const container = document.getElementById('list-container');
            container.innerHTML = `<div class="bg-white rounded-[32px] border p-4 shadow-sm space-y-3">${allTransactions.slice(0, 50).map(t => renderCard(t)).join('')}</div>`;
        }

        function renderBarangMasuk() {
            const container = document.getElementById('list-container');
            const dataBarangMasuk = allTransactions.filter(t => (t.Jenis || t.jenis || "").toString().toUpperCase() === 'BARANG MASUK');
            
            const processedData = dataBarangMasuk.map(t => {
                const target = Number(t.jumlah || 0);
                const itemName = (t.nama_barang || "").toLowerCase();
                const alreadyVerifiedCount = verifiedItems
                    .filter(v => v.transaction_id == t.id && v.nama.toLowerCase().includes(itemName))
                    .reduce((acc, curr) => acc + Number(curr.qty), 0);
                const sisa = Math.max(0, target - alreadyVerifiedCount);
                const isLunas = sisa === 0 || (t.barang_masuk || "").toString().toLowerCase() === 'selesai';
                return { ...t, target, sisa, isLunas };
            });

            const filtered = processedData.filter(t => {
                const matchSearch = (t.nama_barang || "").toLowerCase().includes(bmSearchQuery);
                let matchStatus = true;
                if (currentBMFilter === 'belum') matchStatus = !t.isLunas;
                else if (currentBMFilter === 'selesai') matchStatus = t.isLunas;
                return matchSearch && matchStatus;
            });

            container.innerHTML = `
                <div class="bg-white rounded-[32px] border overflow-hidden divide-y divide-slate-50 shadow-sm">
                    ${filtered.length === 0 ? `
                        <div class="p-12 text-center">
                            <div class="bg-slate-50 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3">
                                <i data-lucide="package-search" class="w-6 h-6 text-slate-300"></i>
                            </div>
                            <p class="text-slate-400 font-bold uppercase text-[10px] tracking-widest">${bmSearchQuery ? 'Barang tidak ditemukan' : 'Tidak ada data ' + currentBMFilter}</p>
                        </div>
                    ` : filtered.map(t => `
                        <div onclick="showDetailModal('${t.nama_barang}', '${t.jumlah || 0}', '${t.id}')" class="p-5 flex justify-between items-center hover:bg-slate-50 active:bg-slate-100 transition-colors cursor-pointer group">
                            <div class="flex-1 overflow-hidden">
                                <p class="text-[9px] text-slate-400 font-bold mb-1 uppercase tracking-tight">${t.waktu ? t.waktu.split('T')[0] : '-'}</p>
                                <div class="flex items-center gap-2 mb-1.5">
                                    <div class="p-1.5 bg-blue-50 rounded-lg text-blue-600 shrink-0">
                                        <i data-lucide="box" class="w-3.5 h-3.5"></i>
                                    </div>
                                    <h4 class="font-black text-sm text-blue-800 uppercase tracking-tight truncate">${t.nama_barang || 'Barang Tanpa Nama'}</h4>
                                </div>
                                <p class="text-[11px] font-bold text-slate-500 uppercase tracking-wide truncate max-w-[90%] mb-2">
                                    <span class="text-slate-300 mr-1">Ket:</span> ${t.ket || t.keterangan || 'Tanpa Keterangan'}
                                </p>
                                <div class="flex items-center gap-2">
                                    <span class="text-[11px] font-black text-slate-400">TARGET x${t.target}</span>
                                    ${!t.isLunas ? `<span class="bg-orange-50 text-orange-600 text-[10px] font-black px-2 py-0.5 rounded-lg border border-orange-100 animate-pulse">SISA x${t.sisa}</span>` : ''}
                                </div>
                            </div>
                            <div class="flex items-center gap-3 ml-2 shrink-0">
                                <span class="px-2.5 py-1 rounded-xl text-[8px] font-black uppercase ${t.isLunas ? 'bg-emerald-100 text-emerald-600' : 'bg-orange-100 text-orange-600'}">
                                    ${t.isLunas ? 'Selesai' : 'Pending'}
                                </span>
                                <i data-lucide="chevron-right" class="w-5 h-5 text-slate-300"></i>
                            </div>
                        </div>
                    `).join('')}
                </div>`;
            lucide.createIcons();
        }

        async function showDetailModal(itemName, itemQty, transactionId) {
            const body = document.getElementById('modal-body');
            const title = document.getElementById('modal-title');
            const footer = document.getElementById('modal-footer');
            currentTransactionContext = { itemName, itemQty, transactionId };
            isShortageMode = false;
            title.innerText = "Verifikasi Barang Masuk";
            footer.classList.add('hidden');
            selectedItemsForSync = [];
            body.innerHTML = `<div class="flex flex-col items-center justify-center py-16"><div class="loader mb-3"></div><span class="text-[10px] font-bold uppercase text-slate-400 tracking-widest">Mencocokkan nota...</span></div>`;
            document.getElementById('modal-container').classList.remove('hidden');
            setTimeout(() => { document.getElementById('modal-backdrop').style.opacity = '1'; document.getElementById('modal-content').style.transform = 'translateY(0)'; }, 10);
            await fetchVerifiedItems();
            const searchQuery = itemName ? itemName.toLowerCase() : "";
            const filteredPurchases = sheetPurchases.filter(p => p.itemRaw.toLowerCase().includes(searchQuery));
            const totalAlreadyVerified = verifiedItems
                .filter(v => v.transaction_id == transactionId && v.nama.toLowerCase().includes(searchQuery))
                .reduce((acc, curr) => acc + Number(curr.qty), 0);
            baseRemainingQty = Math.max(0, itemQty - totalAlreadyVerified);
            body.innerHTML = `
                <div class="p-5 bg-slate-900 rounded-[28px] text-white mb-6 shadow-2xl relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-24 h-24 bg-blue-500/20 rounded-full -mr-10 -mt-10 blur-xl"></div>
                    <p class="text-[9px] font-black opacity-50 uppercase tracking-[0.2em] mb-2">Item Target Verifikasi</p>
                    <div class="flex justify-between items-center">
                        <h4 class="text-xl font-black uppercase tracking-tight flex-1 truncate mr-4">${itemName}</h4>
                        <div class="bg-blue-600/30 backdrop-blur-md border border-blue-400/30 px-4 py-2 rounded-2xl text-center">
                            <span class="block text-[8px] font-bold opacity-70 uppercase mb-0.5">Sisa Target</span>
                            <div id="remaining-qty-display" class="text-sm font-black transition-all">x${baseRemainingQty}</div>
                        </div>
                    </div>
                </div>
                <div id="purchases-list" class="space-y-4 pb-6"></div>`;
            const listContainer = document.getElementById('purchases-list');
            if (filteredPurchases.length === 0) {
                listContainer.innerHTML = `<div class="py-16 text-center text-slate-400 font-bold uppercase text-[10px] bg-slate-50 rounded-[32px] border-2 border-dashed border-slate-100">Riwayat belanja admin tidak ditemukan.</div>`;
            } else {
                let hasItemsToShow = false;
                const htmlContent = filteredPurchases.map((p, pIndex) => {
                    let rincianItem = [];
                    try { rincianItem = JSON.parse(p.itemRaw); } catch(e) { rincianItem = null; }
                    const validItems = Array.isArray(rincianItem) ? rincianItem.filter(it => {
                        const isTarget = it.nama.toLowerCase().includes(searchQuery);
                        const isVerified = verifiedItems.some(v => v.no_transaksi == p.no_transaksi && v.nama == it.nama);
                        return isTarget && !isVerified;
                    }) : [];
                    if (validItems.length === 0) return '';
                    hasItemsToShow = true;
                    return `
                        <div class="p-5 bg-white border border-slate-100 rounded-[32px] shadow-sm space-y-4">
                            <div class="flex justify-between items-center border-b border-slate-50 pb-3">
                                <div><p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">${p.waktu}</p><p class="text-xs font-black text-slate-800">${p.no_transaksi}</p></div>
                                <span class="bg-red-50 text-red-600 px-3 py-1 rounded-xl text-[10px] font-black">-${formatRupiah(p.keluar)}</span>
                            </div>
                            <div class="space-y-2">
                                ${validItems.map((it, itIndex) => {
                                    const uniqueId = `check-${pIndex}-${itIndex}`;
                                    const itemData = JSON.stringify({ parent_id: transactionId, no_transaksi: p.no_transaksi, nama: it.nama, qty: it.qty, harga: it.harga, waktu: p.waktu }).replace(/"/g, '&quot;');
                                    return `
                                        <label for="${uniqueId}" class="flex justify-between items-center text-[11px] bg-slate-50/50 border-slate-100 p-3 rounded-2xl border active:scale-[0.98] cursor-pointer group transition-all hover:bg-blue-50/30">
                                            <div class="flex items-center gap-4">
                                                <div class="relative flex items-center justify-center">
                                                    <input type="checkbox" id="${uniqueId}" class="item-checkbox sr-only" onchange="toggleItemCheck(this, '${itemData}')">
                                                    <div class="checkbox-visual w-6 h-6 border-2 border-slate-200 rounded-xl bg-white flex items-center justify-center transition-all"><i data-lucide="check" class="w-4 h-4 text-white hidden"></i></div>
                                                </div>
                                                <span class="font-bold text-slate-700 uppercase leading-tight">${it.nama}</span>
                                            </div>
                                            <span class="font-black text-slate-500 bg-white px-2.5 py-1.5 rounded-xl border border-slate-100 shadow-sm">x${it.qty}</span>
                                        </label>`;
                                }).join('')}
                            </div>
                        </div>`;
                }).join('');
                listContainer.innerHTML = hasItemsToShow ? htmlContent : `<div class="py-16 text-center text-slate-400 font-bold uppercase text-[10px] bg-slate-50 rounded-[32px] border-2 border-dashed border-slate-100">Semua nota sudah diproses.</div>`;
            }
            if (baseRemainingQty > 0) footer.classList.remove('hidden');
            lucide.createIcons();
        }

        function toggleShortageMode() {
            const btn = document.getElementById('btn-shortage-mode');
            const display = document.getElementById('remaining-qty-display');
            const bonusAlert = document.getElementById('bonus-alert');
            const totalSelectedQty = selectedItemsForSync.reduce((acc, curr) => acc + Number(curr.qty), 0);
            isShortageMode = !isShortageMode;
            if (isShortageMode) {
                btn.innerText = "Batalkan";
                btn.classList.replace('bg-indigo-600', 'bg-slate-500');
                display.className = "text-sm font-black transition-all text-indigo-400";
                display.innerHTML = `LUNAS (P)`;
                bonusAlert.classList.add('hidden');
            } else {
                btn.innerText = "Lunasi Sisa";
                btn.classList.replace('bg-slate-500', 'bg-indigo-600');
                const newRemaining = Math.max(0, baseRemainingQty - totalSelectedQty);
                display.innerText = newRemaining === 0 ? 'LUNAS' : `x${newRemaining}`;
                display.className = `text-sm font-black transition-all ${newRemaining === 0 ? 'text-emerald-400' : 'text-white'}`;
                const excess = Math.max(0, totalSelectedQty - baseRemainingQty);
                if (excess > 0) bonusAlert.classList.remove('hidden');
            }
        }

        function toggleItemCheck(el, dataStr) {
            const data = JSON.parse(dataStr);
            const label = el.closest('label');
            const display = document.getElementById('remaining-qty-display');
            const bonusAlert = document.getElementById('bonus-alert');
            const bonusText = document.getElementById('bonus-text');
            if (el.checked) {
                label.classList.add('bg-blue-50', 'border-blue-400', 'ring-2', 'ring-blue-100');
                label.classList.remove('bg-slate-50/50', 'border-slate-100');
                selectedItemsForSync.push(data);
            } else {
                label.classList.remove('bg-blue-50', 'border-blue-400', 'ring-2', 'ring-blue-100');
                label.classList.add('bg-slate-50/50', 'border-slate-100');
                selectedItemsForSync = selectedItemsForSync.filter(i => !(i.no_transaksi === data.no_transaksi && i.nama === data.nama));
            }
            const totalSelectedQty = selectedItemsForSync.reduce((acc, curr) => acc + Number(curr.qty), 0);
            const newRemaining = Math.max(0, baseRemainingQty - totalSelectedQty);
            const excess = Math.max(0, totalSelectedQty - baseRemainingQty);
            if (!isShortageMode) {
                display.innerText = newRemaining === 0 ? 'LUNAS' : `x${newRemaining}`;
                display.className = `text-sm font-black transition-all ${newRemaining === 0 ? 'text-emerald-400' : 'text-white'}`;
                if (excess > 0) {
                    bonusAlert.classList.remove('hidden');
                    bonusText.innerText = `Terpilih x${totalSelectedQty}. Sisa x${excess} dicatat sebagai BONUS.`;
                } else {
                    bonusAlert.classList.add('hidden');
                }
            }
        }

        async function saveVerifiedItems() {
            const btn = document.getElementById('btn-save-verification');
            const totalSelectedQty = selectedItemsForSync.reduce((acc, curr) => acc + Number(curr.qty), 0);
            if (selectedItemsForSync.length === 0 && !isShortageMode) return;
            btn.disabled = true;
            btn.innerHTML = `<div class="loader"></div> <span class="ml-3">Memproses...</span>`;
            let cumulativeQty = 0;
            const itemsToSave = selectedItemsForSync.map(item => {
                const itemQty = Number(item.qty);
                const startAt = cumulativeQty;
                cumulativeQty += itemQty;
                let regularPart = 0, bonusPart = 0;
                if (startAt >= baseRemainingQty) bonusPart = itemQty;
                else if (cumulativeQty > baseRemainingQty) { regularPart = baseRemainingQty - startAt; bonusPart = itemQty - regularPart; }
                else regularPart = itemQty;
                return { ...item, regular_qty: regularPart, bonus_qty: bonusPart, is_bonus: bonusPart > 0 };
            });
            if (isShortageMode && totalSelectedQty < baseRemainingQty) {
                const shortageDiff = baseRemainingQty - totalSelectedQty;
                itemsToSave.push({ parent_id: currentTransactionContext.transactionId, no_transaksi: "VERIF-LUNAS", nama: currentTransactionContext.itemName, qty: shortageDiff, regular_qty: shortageDiff, bonus_qty: 0, is_bonus: false, is_adjustment: true, waktu: new Date().toISOString() });
            }
            try {
                await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'add_verified_items', spreadsheet_id: SPREADSHEET_ID, items: itemsToSave }) });
                btn.classList.replace('bg-blue-600', 'bg-emerald-600');
                btn.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4"></i> Berhasil`;
                setTimeout(() => { closeModal(); fetchData(); }, 1200);
            } catch (e) { btn.disabled = false; btn.innerHTML = "Gagal Simpan"; }
        }

        function closeModal() {
            document.getElementById('modal-backdrop').style.opacity = '0';
            document.getElementById('modal-content').style.transform = 'translateY(100%)';
            setTimeout(() => document.getElementById('modal-container').classList.add('hidden'), 300);
        }

        function renderCard(t) {
            const isMasuk = Number(t.masuk || 0) > 0;
            return `<div class="p-4 bg-slate-50/50 rounded-2xl flex justify-between items-center border border-slate-100">
                <div class="flex-1 pr-4">
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">${t.waktu ? t.waktu.split('T')[0] : ''}</p>
                    <p class="font-bold text-slate-800 text-sm uppercase truncate">${t.ket || t.keterangan || 'Kas'}</p>
                </div>
                <div class="text-right shrink-0">
                    <p class="font-black text-sm ${isMasuk ? 'text-emerald-600' : 'text-rose-600'}">${isMasuk ? '+' : '-'}${formatRupiah(isMasuk ? t.masuk : t.keluar)}</p>
                    <p class="text-[8px] text-slate-300 font-bold uppercase mt-0.5 tracking-widest">#${t.id}</p>
                </div>
            </div>`;
        }

        function formatRupiah(n) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(Math.abs(n)); }
    </script>
</body>
</html>
