<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kasir & Arus Kas Modern</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-active { color: #2563eb !important; }
    .nav-active i { transform: translateY(-2px); transition: transform 0.2s; }
    .page-transition { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .loader { border: 2px solid #f3f3f3; border-top: 2px solid #3498db; border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .syncing-overlay {
        position: absolute;
        inset: 0;
        background: rgba(255,255,255,0.7);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        border-radius: inherit;
    }
  </style>
</head>
<body class="max-w-md mx-auto min-h-screen shadow-2xl relative bg-white pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-100 p-4">
        <div class="flex justify-between items-center">
            <div>
                <h1 id="page-title" class="text-xl font-black text-slate-800 tracking-tight text-blue-600 uppercase">BERANDA</h1>
                <p id="current-date" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Memuat...</p>
            </div>
            <div class="flex gap-2">
                <div id="sync-indicator" class="hidden"><div class="loader"></div></div>
                <button onclick="fetchData()" class="p-2.5 bg-slate-100 rounded-2xl text-slate-600 hover:bg-slate-200 transition-colors">
                    <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <main id="app-content" class="p-4 space-y-6 page-transition">
        <!-- Dashboard -->
        <div id="dashboard-container" class="space-y-4">
            <div class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-[32px] p-6 text-white shadow-xl relative overflow-hidden text-center">
                <p class="text-[10px] font-bold opacity-80 uppercase tracking-widest mb-1">Total Saldo Tunai</p>
                <h2 id="total-saldo" class="text-3xl font-black tracking-tight mb-4">Rp 0</h2>
                <div class="flex gap-3">
                    <div class="flex-1 bg-white/10 backdrop-blur-sm rounded-2xl p-3">
                        <p class="text-[8px] font-bold opacity-70 uppercase mb-0.5">Pemasukan</p>
                        <p id="total-masuk" class="text-xs font-black">Rp 0</p>
                    </div>
                    <div class="flex-1 bg-white/10 backdrop-blur-sm rounded-2xl p-3">
                        <p class="text-[8px] font-bold opacity-70 uppercase mb-0.5">Pengeluaran</p>
                        <p id="total-keluar" class="text-xs font-black">Rp 0</p>
                    </div>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4 mt-6">
                <button onclick="changeTab('barang_masuk')" class="flex flex-col items-center gap-2 p-5 bg-orange-50 rounded-[28px] border border-orange-100 active:scale-95 transition-all">
                    <div class="p-3 bg-orange-500 rounded-2xl text-white shadow-lg shadow-orange-200">
                        <i data-lucide="package-check" class="w-6 h-6"></i>
                    </div>
                    <span class="text-[10px] font-black text-orange-700 uppercase tracking-wider">Cek Stok Masuk</span>
                </button>
                <button onclick="changeTab('nota_belanja')" class="flex flex-col items-center gap-2 p-5 bg-indigo-50 rounded-[28px] border border-indigo-100 active:scale-95 transition-all">
                    <div class="p-3 bg-indigo-600 rounded-2xl text-white shadow-lg shadow-indigo-200">
                        <i data-lucide="receipt" class="w-6 h-6"></i>
                    </div>
                    <span class="text-[10px] font-black text-indigo-700 uppercase tracking-wider">Nota Belanja</span>
                </button>
            </div>
        </div>

        <!-- Filter & Search -->
        <div id="search-wrapper" class="hidden space-y-4">
            <div class="relative">
                <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-slate-400">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </div>
                <input 
                    type="text" 
                    id="bm-search-input"
                    oninput="handleBMSearch(this.value)"
                    placeholder="Cari data..." 
                    class="w-full bg-slate-100 border-none rounded-2xl py-4 pl-12 pr-4 text-xs font-bold text-slate-800 outline-none"
                >
            </div>

            <div class="flex gap-1 bg-slate-100 p-1 rounded-2xl">
                <button onclick="setBMFilter('belum')" id="btn-f-belum" class="flex-1 py-2 text-[10px] font-bold rounded-xl transition-all bg-white shadow-sm text-blue-600 uppercase">Pending</button>
                <button onclick="setBMFilter('selesai')" id="btn-f-selesai" class="flex-1 py-2 text-[10px] font-bold rounded-xl transition-all text-slate-500 uppercase">Selesai</button>
                <button onclick="setBMFilter('semua')" id="btn-f-semua" class="flex-1 py-2 text-[10px] font-bold rounded-xl transition-all text-slate-500 uppercase">Semua</button>
            </div>
        </div>

        <div id="list-container" class="hidden space-y-4"></div>
    </main>

    <!-- Modals -->
    <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0">
        <div id="modal-backdrop" onclick="closeModal()" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm opacity-0 transition-opacity duration-300"></div>
        <div id="modal-content" class="relative bg-white w-full max-w-md rounded-t-[32px] sm:rounded-[32px] shadow-2xl transform translate-y-full transition-transform duration-300 overflow-hidden flex flex-col max-h-[95vh]">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 id="modal-title" class="font-black text-slate-800 uppercase tracking-tight text-xs">Detail</h3>
                <button onclick="closeModal()" class="p-2 bg-white rounded-full shadow-sm text-slate-400">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto flex-1 bg-white"></div>
            <div id="modal-footer" class="p-4 bg-slate-50 border-t border-slate-100 hidden">
                 <button onclick="manualCompletion()" id="btn-manual-comp" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black uppercase text-[10px] shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                    Masukkan Sisa Sebagai Bonus
                 </button>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-lg border-t border-slate-100 px-6 py-4 z-40">
        <div class="flex justify-between items-center max-w-xs mx-auto">
            <button onclick="changeTab('beranda')" id="nav-beranda" class="flex flex-col items-center gap-1 text-slate-400 nav-active">
                <i data-lucide="layout-grid" class="w-6 h-6"></i>
                <span class="text-[9px] font-bold uppercase tracking-wider">Mulai</span>
            </button>
            <button onclick="changeTab('nota_belanja')" id="nav-nota_belanja" class="flex flex-col items-center gap-1 text-slate-400">
                <i data-lucide="receipt" class="w-6 h-6"></i>
                <span class="text-[9px] font-bold uppercase tracking-wider">Nota</span>
            </button>
            <button onclick="changeTab('barang_masuk')" id="nav-barang_masuk" class="flex flex-col items-center gap-1 text-slate-400">
                <i data-lucide="package-search" class="w-6 h-6"></i>
                <span class="text-[9px] font-bold uppercase tracking-wider">Stok</span>
            </button>
        </div>
    </nav>

    <div id="custom-alert" class="hidden fixed top-10 left-1/2 -translate-x-1/2 z-[100] w-[90%] max-w-xs p-4 rounded-2xl bg-slate-900 text-white text-[10px] font-bold uppercase tracking-wider text-center shadow-2xl animate-bounce"></div>

    <script>
        const SUPABASE_URL = "https://zqxeoveanevsvynptckm.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxeGVvdmVhbmV2c3Z5bnB0Y2ttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyNzUzODEsImV4cCI6MjA4OTg1MTM4MX0.eeIaytpW1wtWPJc2FbhufkDkhONUt9yypTZU4dTVmsM";
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRvAQXltAVp8lnrXXVVPJr1hYEi8cAJrqz182qT23eaiI8t-MoBrEtE7bAAJqKEyKKTig4hpA9DNuQB/pub?gid=2057149863&single=true&output=csv";
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZNmMPh3BM6IU9529KSCzxhEMhZlfvwCmjcl8B2aiyFO_JGsNrf2NJGsWEXtDm6wlWaQ/exec"; 
        const SPREADSHEET_ID = "15qzJ3txkTBYNFc09RWUAr5ZKUa_lQcOHKCThwJ3r0Fk";

        let allTransactions = [];
        let sheetPurchases = [];
        let verifiedItems = [];
        let currentTab = 'beranda';
        let currentBMFilter = 'belum';
        let bmSearchQuery = "";
        let baseRemainingQty = 0;
        let currentContext = null;

        document.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            const dateEl = document.getElementById('current-date');
            if(dateEl) dateEl.innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            fetchData();
        });

        async function fetchData() {
            const indicator = document.getElementById('sync-indicator');
            if(indicator) indicator.classList.remove('hidden');
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/riwayat?select=*`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                const data = await response.json();
                if (Array.isArray(data)) allTransactions = data.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
                
                const csvRes = await fetch(CSV_URL);
                const csvText = await csvRes.text();
                sheetPurchases = parseCSV(csvText);
                
                await fetchVerifiedItems();
                updateDashboard();
                refreshView();
            } catch (err) { 
                console.error("Fetch Error:", err); 
            } finally { 
                if(indicator) indicator.classList.add('hidden'); 
            }
        }

        async function fetchVerifiedItems() {
            try {
                const res = await fetch(`${APPS_SCRIPT_URL}?spreadsheet_id=${SPREADSHEET_ID}`);
                const result = await res.json();
                verifiedItems = result.data || [];
            } catch (e) { verifiedItems = []; }
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/);
            if (lines.length < 2) return [];
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                if (!line.trim()) continue;
                const row = [];
                let inQuotes = false, val = '';
                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"') { 
                        if (inQuotes && line[j+1] === '"') { val += '"'; j++; } 
                        else inQuotes = !inQuotes; 
                    }
                    else if (char === ',' && !inQuotes) { row.push(val.trim()); val = ''; }
                    else val += char;
                }
                row.push(val.trim());
                if (row[3] && row[3].toLowerCase() === 'pembelian') {
                    result.push({ no_transaksi: row[0], waktu: row[1], keterangan: row[4], keluar: row[6], itemRaw: row[10] || "[]" });
                }
            }
            return result;
        }

        function refreshView() {
            ['beranda', 'nota_belanja', 'barang_masuk'].forEach(t => {
                const nav = document.getElementById('nav-' + t);
                if (nav) nav.classList.toggle('nav-active', currentTab === t);
            });
            if (currentTab === 'nota_belanja') renderNotaBelanja();
            else if (currentTab === 'barang_masuk') renderBarangMasuk();
            lucide.createIcons();
        }

        function updateDashboard() {
            let masuk = 0, keluar = 0;
            allTransactions.forEach(t => { masuk += Number(t.masuk || 0); keluar += Number(t.keluar || 0); });
            const sMasuk = document.getElementById('total-masuk');
            const sKeluar = document.getElementById('total-keluar');
            const sSaldo = document.getElementById('total-saldo');
            if(sMasuk) sMasuk.innerText = formatRupiah(masuk);
            if(sKeluar) sKeluar.innerText = formatRupiah(keluar);
            if(sSaldo) sSaldo.innerText = formatRupiah(masuk - keluar);
        }

        function changeTab(tab) {
            currentTab = tab;
            document.getElementById('page-title').innerText = tab.replace('_', ' ').toUpperCase();
            document.getElementById('dashboard-container').classList.toggle('hidden', tab !== 'beranda');
            document.getElementById('search-wrapper').classList.toggle('hidden', tab === 'beranda');
            document.getElementById('list-container').classList.toggle('hidden', tab === 'beranda');
            refreshView();
        }

        function handleBMSearch(val) { bmSearchQuery = val.toLowerCase(); refreshView(); }
        
        function setBMFilter(v) {
            currentBMFilter = v;
            ['belum', 'selesai', 'semua'].forEach(f => {
                const btn = document.getElementById(`btn-f-${f}`);
                if (f === v) btn.classList.add('bg-white', 'shadow-sm', 'text-blue-600');
                else btn.classList.remove('bg-white', 'shadow-sm', 'text-blue-600');
            });
            refreshView();
        }

        function showAlert(msg) {
            const el = document.getElementById('custom-alert');
            el.innerText = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3000);
        }

        function renderNotaBelanja() {
            const container = document.getElementById('list-container');
            const filtered = sheetPurchases.filter(p => {
                const match = p.no_transaksi.toLowerCase().includes(bmSearchQuery) || p.keterangan.toLowerCase().includes(bmSearchQuery);
                let items = [];
                try { items = JSON.parse(p.itemRaw); } catch(e) { items = []; }
                const allV = items.length > 0 && items.every(it => verifiedItems.some(v => v.no_transaksi === p.no_transaksi && v.nama === it.nama));
                if (currentBMFilter === 'belum') return match && !allV;
                if (currentBMFilter === 'selesai') return match && allV;
                return match;
            });

            container.innerHTML = filtered.map(p => {
                let items = [];
                try { items = JSON.parse(p.itemRaw); } catch(e) { items = []; }
                return `
                <div class="bg-white rounded-[32px] border p-5 shadow-sm space-y-4">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">${p.waktu}</p>
                            <h4 class="font-black text-slate-800 text-sm">${p.no_transaksi}</h4>
                        </div>
                        <span class="bg-red-50 text-red-600 px-3 py-1 rounded-xl text-[10px] font-black">-${formatRupiah(p.keluar)}</span>
                    </div>
                    <div class="space-y-2">
                        ${items.map(it => {
                            const vRecord = verifiedItems.find(v => v.no_transaksi === p.no_transaksi && v.nama === it.nama);
                            const isV = !!vRecord;
                            
                            let sisaGudangUI = '';
                            if (isV) {
                                const parentBM = allTransactions.find(t => (t.id || t.ID) == vRecord.parent_id);
                                if (parentBM) {
                                    const vCount = verifiedItems.filter(v => v.parent_id == parentBM.id || v.parent_id == parentBM.ID)
                                                   .reduce((acc, curr) => acc + Number(curr.qty), 0);
                                    const sisa = Math.max(0, Number(parentBM.jumlah || 0) - vCount);
                                    sisaGudangUI = `<span class="bg-blue-50 text-blue-600 px-2 py-0.5 rounded-lg text-[8px] font-black uppercase">Sisa Gudang: x${sisa}</span>`;
                                }
                            }

                            const itemDataStr = JSON.stringify({no_transaksi: p.no_transaksi, nama: it.nama, qty: it.qty, harga: it.harga || 0, waktu: p.waktu}).replace(/"/g, '&quot;');
                            
                            return `
                            <div onclick="openStockPicker('${itemDataStr}', ${isV})" 
                                 class="flex flex-col gap-1 p-3 rounded-2xl bg-slate-50 border cursor-pointer active:scale-95 transition-all hover:border-blue-200 ${isV ? 'border-emerald-100 bg-emerald-50/20' : ''}">
                                <div class="flex justify-between items-center">
                                    <span class="text-[10px] font-bold text-slate-700 uppercase truncate pr-4">${it.nama}</span>
                                    <div class="flex items-center gap-2">
                                        <span class="text-[10px] font-black text-slate-500">x${it.qty}</span>
                                        ${isV ? '<i data-lucide="check-circle" class="w-4 h-4 text-emerald-500"></i>' : '<i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>'}
                                    </div>
                                </div>
                                ${isV ? `<div class="mt-1 flex items-center gap-2">${sisaGudangUI}</div>` : ''}
                            </div>`;
                        }).join('')}
                    </div>
                </div>`}).join('');
        }

        function getSimilarityScore(itemName, stockName) {
            itemName = itemName.toLowerCase();
            stockName = stockName.toLowerCase();
            if (itemName === stockName) return 100;
            if (stockName.includes(itemName) || itemName.includes(stockName)) return 80;
            const itemWords = itemName.split(/\s+/).filter(w => w.length > 2);
            let matches = 0;
            itemWords.forEach(iw => { if (stockName.includes(iw)) matches++; });
            if (matches > 0) return 50 + (matches * 10);
            return 0;
        }

        async function openStockPicker(itemDataStr, isVerified) {
            if (isVerified) return;
            const itemData = JSON.parse(itemDataStr);
            const body = document.getElementById('modal-body');
            
            document.getElementById('modal-title').innerText = "Pilih Stok Gudang";
            document.getElementById('modal-footer').classList.add('hidden');
            document.getElementById('modal-container').classList.remove('hidden');
            setTimeout(() => { 
                document.getElementById('modal-backdrop').style.opacity = '1'; 
                document.getElementById('modal-content').style.transform = 'translateY(0)'; 
            }, 10);

            body.innerHTML = `<div class="flex justify-center py-12"><div class="loader"></div></div>`;
            
            const listGudang = allTransactions.filter(t => (t.Jenis || t.jenis || "").toString().toUpperCase() === 'BARANG MASUK')
                .map(t => {
                    const id = t.id || t.ID;
                    const target = Number(t.jumlah || 0);
                    // Hitung total Qty dari spreadsheet (gTransaction ID ada di kolom G / transaction_id)
                    const vCount = verifiedItems.filter(v => v.transaction_id == id || v.parent_id == id)
                                   .reduce((acc, curr) => acc + Number(curr.qty || 0), 0);
                    const sisa = Math.max(0, target - vCount);
                    const similarity = getSimilarityScore(itemData.nama, (t.nama_barang || t.Nama_Barang || ""));
                    return { ...t, sisa, realId: id, similarity, nama_barang: t.nama_barang || t.Nama_Barang };
                })
                .filter(t => t.sisa > 0);

            const recommended = listGudang.filter(g => g.similarity > 0).sort((a, b) => b.similarity - a.similarity);
            const others = listGudang.filter(g => g.similarity === 0).sort((a, b) => a.nama_barang.localeCompare(b.nama_barang));

            const renderItem = (g, isRec) => {
                const isMatchQty = Number(g.sisa) === Number(itemData.qty);
                const itemDataEscaped = JSON.stringify(itemData).replace(/"/g, '&quot;');
                return `
                <div onclick="processVerificationFromNota('${g.realId}', '${itemDataEscaped}', this)" 
                     class="p-4 border-2 ${isRec ? 'border-blue-100 bg-blue-50/20' : 'border-slate-50'} rounded-[24px] flex justify-between items-center cursor-pointer hover:border-blue-400 active:scale-95 transition-all">
                    <div class="flex flex-col gap-1 overflow-hidden pr-2">
                        <span class="text-[11px] font-black text-slate-800 uppercase truncate">${g.nama_barang}</span>
                        <div class="flex gap-2">
                            <span class="text-[9px] font-bold text-slate-400 uppercase">Gudang: x${g.sisa}</span>
                            ${isMatchQty ? '<span class="bg-emerald-50 text-emerald-600 px-1.5 py-0.5 rounded-md text-[8px] font-black uppercase">Qty Match</span>' : ''}
                        </div>
                    </div>
                    <div class="shrink-0 flex items-center">
                        ${isRec ? `<span class="mr-2 text-[8px] font-black text-blue-400">${g.similarity}%</span>` : ''}
                        <i data-lucide="${isRec ? 'star' : 'plus-circle'}" class="w-5 h-5 ${isRec ? 'text-blue-500 fill-blue-500' : 'text-slate-300'}"></i>
                    </div>
                </div>`;
            };

            body.innerHTML = `
                <div class="p-4 bg-indigo-50 border border-indigo-100 rounded-2xl mb-6">
                    <div class="flex items-center gap-2 mb-1">
                         <i data-lucide="info" class="w-3 h-3 text-indigo-400"></i>
                         <p class="text-[8px] font-black text-indigo-400 uppercase">Item Nota Terpilih</p>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-black text-indigo-700 uppercase">${itemData.nama}</span>
                        <span class="bg-indigo-600 text-white px-3 py-1 rounded-xl text-[10px] font-black shadow-sm">x${itemData.qty}</span>
                    </div>
                </div>
                ${recommended.length > 0 ? `
                    <div class="flex justify-between items-center mb-3 px-1">
                        <p class="text-[9px] font-black text-blue-500 uppercase tracking-widest flex items-center gap-2">
                            <i data-lucide="zap" class="w-3 h-3"></i> Sangat Cocok
                        </p>
                    </div>
                    <div class="space-y-3 mb-6">${recommended.map(g => renderItem(g, true)).join('')}</div>
                ` : ''}
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3 px-1">
                    ${recommended.length > 0 ? 'Stok Gudang Lainnya' : 'Pilih Stok Masuk Gudang'}
                </p>
                <div class="space-y-3">
                    ${others.map(g => renderItem(g, false)).join('')}
                    ${listGudang.length === 0 ? '<div class="py-12 flex flex-col items-center gap-3"><i data-lucide="box" class="w-8 h-8 text-slate-200"></i><p class="text-[10px] font-bold text-slate-300">Gudang Kosong</p></div>' : ''}
                </div>`;
            lucide.createIcons();
        }

        async function processVerificationFromNota(bmId, itemDataStr, element) {
            const itemData = JSON.parse(itemDataStr);
            const notaQty = Number(itemData.qty);
            const bmRaw = allTransactions.find(t => (t.id || t.ID) == bmId);
            const vCount = verifiedItems.filter(v => v.transaction_id == bmId || v.parent_id == bmId)
                           .reduce((acc, curr) => acc + Number(curr.qty || 0), 0);
            const bmSisa = Number(bmRaw.jumlah || 0) - vCount;

            if (bmSisa < notaQty) {
                showAlert("Gagal: Stok gudang tidak cukup");
                return;
            }

            const overlay = document.createElement('div');
            overlay.className = 'syncing-overlay';
            overlay.innerHTML = `<div class="loader mb-2"></div>`;
            element.classList.add('relative');
            element.appendChild(overlay);

            const itemToSave = [{
                parent_id: String(bmId),
                transaction_id: String(bmId),
                no_transaksi: itemData.no_transaksi,
                nama: itemData.nama,
                qty: notaQty,
                harga: Number(itemData.harga),
                waktu: itemData.waktu || new Date().toISOString()
            }];

            try {
                await fetch(APPS_SCRIPT_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify({ action: 'add_verified_items', spreadsheet_id: SPREADSHEET_ID, items: itemToSave }) 
                });
                verifiedItems.push({ ...itemToSave[0] });
                showAlert("Verifikasi Berhasil!");
                closeModal();
                fetchData();
            } catch (e) { 
                if (overlay) overlay.remove(); 
                showAlert("Gagal menyimpan data"); 
            }
        }

        function renderBarangMasuk() {
            const container = document.getElementById('list-container');
            const filtered = allTransactions.filter(t => (t.Jenis || t.jenis || "").toString().toUpperCase() === 'BARANG MASUK')
                .map(t => {
                    const id = t.id || t.ID;
                    const target = Number(t.jumlah || 0);
                    const vCount = verifiedItems.filter(v => v.transaction_id == id || v.parent_id == id)
                                   .reduce((acc, curr) => acc + Number(curr.qty || 0), 0);
                    const sisa = Math.max(0, target - vCount);
                    return { ...t, target, sisa, isLunas: sisa === 0, realId: id };
                })
                .filter(t => {
                    const name = (t.nama_barang || t.Nama_Barang || "").toLowerCase();
                    const match = name.includes(bmSearchQuery);
                    if (currentBMFilter === 'belum') return match && !t.isLunas;
                    if (currentBMFilter === 'selesai') return match && t.isLunas;
                    return match;
                });

            container.innerHTML = `<div class="bg-white rounded-[32px] border divide-y divide-slate-50">${filtered.map(t => `
                <div onclick="showDetailGudang('${(t.nama_barang || t.Nama_Barang).replace(/'/g, "\\'")}', '${t.target}', '${t.realId}')" class="p-5 flex justify-between items-center cursor-pointer active:bg-slate-50 transition-colors">
                    <div>
                        <h4 class="font-black text-sm text-slate-800 uppercase">${t.nama_barang || t.Nama_Barang}</h4>
                        <div class="flex gap-2 mt-1">
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Target x${t.target}</span>
                            ${!t.isLunas ? `<span class="bg-orange-50 text-orange-600 text-[10px] font-black px-2 rounded-lg">Sisa x${t.sisa}</span>` : '<span class="bg-emerald-50 text-emerald-600 text-[10px] font-black px-2 rounded-lg">Selesai</span>'}
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-slate-200"></i>
                </div>`).join('')}</div>`;
        }

        async function showDetailGudang(name, qty, id) {
            const body = document.getElementById('modal-body');
            currentContext = { name, qty, id };
            document.getElementById('modal-title').innerText = "Validasi Stok";
            document.getElementById('modal-container').classList.remove('hidden');
            setTimeout(() => { 
                document.getElementById('modal-backdrop').style.opacity = '1'; 
                document.getElementById('modal-content').style.transform = 'translateY(0)'; 
            }, 10);
            
            body.innerHTML = `<div class="flex justify-center py-12"><div class="loader"></div></div>`;
            await fetchVerifiedItems();
            
            // Logika baru: Hitung sisa stok berdasarkan Qty di spreadsheet
            const currentVerified = verifiedItems.filter(v => v.transaction_id == id || v.parent_id == id);
            const vCount = currentVerified.reduce((acc, curr) => acc + Number(curr.qty || 0), 0);
            baseRemainingQty = Math.max(0, Number(qty) - vCount);

            const searchKey = name.toLowerCase().split(' ')[0];
            const matchingPurchases = sheetPurchases.filter(p => p.itemRaw.toLowerCase().includes(searchKey));

            body.innerHTML = `
                <div class="p-5 bg-slate-900 rounded-[28px] text-white mb-6">
                    <p class="text-[9px] font-black opacity-40 uppercase mb-1 text-center">Sisa Stok Barang Masuk</p>
                    <div class="flex justify-between items-center">
                        <h4 class="text-lg font-black uppercase truncate mr-4">${name}</h4>
                        <div id="rem-badge" class="bg-blue-600 px-4 py-2 rounded-2xl text-xs font-black shadow-lg">x${baseRemainingQty}</div>
                    </div>
                </div>

                ${currentVerified.length > 0 ? `
                <div class="mb-6">
                    <p class="text-[9px] font-black text-emerald-500 uppercase tracking-widest mb-3 flex items-center gap-2">
                         <i data-lucide="check-square" class="w-3 h-3"></i> Terverifikasi (Total x${vCount})
                    </p>
                    <div class="space-y-2">
                        ${currentVerified.map(v => `
                        <div class="flex justify-between items-center p-3 bg-emerald-50/50 border border-emerald-100 rounded-2xl">
                            <div class="overflow-hidden">
                                <p class="text-[8px] font-black text-emerald-400 uppercase truncate">${v.no_transaksi}</p>
                                <p class="text-[10px] font-bold text-emerald-700 uppercase truncate">${v.nama}</p>
                            </div>
                            <span class="text-[10px] font-black text-emerald-600 ml-4 shrink-0">x${v.qty}</span>
                        </div>
                        `).join('')}
                    </div>
                </div>
                ` : ''}

                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                    <i data-lucide="link" class="w-3 h-3"></i> Cari kecocokan di Nota
                </p>
                <div id="nota-list" class="space-y-4"></div>`;

            if (baseRemainingQty > 0) {
                document.getElementById('modal-footer').classList.remove('hidden');
            } else {
                document.getElementById('modal-footer').classList.add('hidden');
            }

            const list = document.getElementById('nota-list');
            if (!matchingPurchases.length) {
                list.innerHTML = `<div class="py-12 text-center text-[10px] font-bold text-slate-300 border-2 border-dashed rounded-3xl">Tidak ditemukan item nota serupa</div>`;
            } else {
                let itemsList = [];
                matchingPurchases.forEach(p => {
                    let parsed = [];
                    try { parsed = JSON.parse(p.itemRaw); } catch(e) {}
                    parsed.forEach(it => {
                        const score = getSimilarityScore(name, it.nama);
                        if (score > 0) {
                            const isV = verifiedItems.some(v => v.no_transaksi === p.no_transaksi && v.nama === it.nama);
                            if(!isV) itemsList.push({ ...it, no_transaksi: p.no_transaksi, waktu: p.waktu, score });
                        }
                    });
                });
                
                itemsList.sort((a, b) => b.score - a.score);
                
                if(itemsList.length === 0) {
                    list.innerHTML = `<div class="py-8 text-center text-[10px] font-bold text-slate-300">Semua nota terkait sudah terverifikasi</div>`;
                } else {
                    list.innerHTML = itemsList.map(it => {
                        const itemDataEscaped = JSON.stringify({parent_id: id, no_transaksi: it.no_transaksi, nama: it.nama, qty: it.qty, harga: it.harga || 0, waktu: it.waktu}).replace(/"/g, '&quot;');
                        return `
                            <div onclick="handleItemClickFromModal(this, false, '${itemDataEscaped}')" class="p-4 border border-slate-100 rounded-[28px] flex justify-between items-center cursor-pointer transition-all hover:border-blue-300 active:scale-95">
                                <div>
                                    <div class="flex items-center gap-2 mb-1">
                                        <p class="text-[9px] font-bold text-slate-400 uppercase">${it.no_transaksi}</p>
                                        <span class="text-[8px] font-black text-blue-400 bg-blue-50 px-1.5 py-0.5 rounded-md">${it.score}%</span>
                                    </div>
                                    <span class="text-[11px] font-bold uppercase text-slate-700">${it.nama}</span>
                                </div>
                                <div class="text-right flex items-center gap-3">
                                    <span class="block text-[11px] font-black ${Number(it.qty) > baseRemainingQty ? 'text-red-500' : 'text-slate-500'}">x${it.qty}</span>
                                    <i data-lucide="plus-circle" class="w-4 h-4 text-slate-200"></i>
                                </div>
                            </div>`;
                    }).join('');
                }
            }
            lucide.createIcons();
        }

        async function handleItemClickFromModal(element, isV, dataStr) {
            if (isV) return;
            const data = JSON.parse(dataStr);
            if (baseRemainingQty < Number(data.qty)) {
                showAlert(`Gagal: Stok gudang kurang (Sisa x${baseRemainingQty})`);
                return;
            }
            const overlay = document.createElement('div');
            overlay.className = 'syncing-overlay';
            overlay.innerHTML = `<div class="loader mb-2"></div>`;
            element.classList.add('relative');
            element.appendChild(overlay);
            try {
                const itemToSave = [{ ...data, transaction_id: String(data.parent_id) }];
                await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'add_verified_items', spreadsheet_id: SPREADSHEET_ID, items: itemToSave }) });
                verifiedItems.push(itemToSave[0]);
                baseRemainingQty -= Number(data.qty);
                
                const badge = document.getElementById('rem-badge');
                if (badge) badge.innerText = baseRemainingQty === 0 ? 'SELESAI' : `x${baseRemainingQty}`;
                
                element.classList.add('opacity-30', 'pointer-events-none');
                if (overlay) overlay.remove();
                
                showAlert("Berhasil diverifikasi!");
                if(baseRemainingQty === 0) {
                    setTimeout(() => { closeModal(); fetchData(); }, 1000);
                } else {
                    showDetailGudang(currentContext.name, currentContext.qty, currentContext.id);
                }
            } catch (e) { if (overlay) overlay.remove(); showAlert("Koneksi bermasalah"); }
        }

        async function manualCompletion() {
            if (baseRemainingQty <= 0) return;
            
            const btn = document.getElementById('btn-manual-comp');
            const originalContent = btn.innerHTML;
            btn.disabled = true; 
            btn.innerHTML = '<div class="loader mx-auto"></div>';
            
            const item = [{ 
                parent_id: String(currentContext.id), 
                transaction_id: String(currentContext.id), 
                no_transaksi: "BONUS/MANUAL", 
                nama: currentContext.name + " (Penyesuaian)", 
                qty: baseRemainingQty, 
                harga: 0, 
                waktu: new Date().toISOString() 
            }];

            try {
                await fetch(APPS_SCRIPT_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify({ 
                        action: 'add_verified_items', 
                        spreadsheet_id: SPREADSHEET_ID, 
                        items: item 
                    }) 
                });
                showAlert("Sisa stok berhasil dimasukkan!");
                setTimeout(() => { closeModal(); fetchData(); }, 500);
            } catch (e) { 
                btn.disabled = false; 
                btn.innerHTML = originalContent; 
                showAlert("Gagal melakukan penyesuaian");
            }
        }

        function closeModal() {
            const backdrop = document.getElementById('modal-backdrop');
            const content = document.getElementById('modal-content');
            if(backdrop) backdrop.style.opacity = '0';
            if(content) content.style.transform = 'translateY(100%)';
            setTimeout(() => {
                const modal = document.getElementById('modal-container');
                if(modal) modal.classList.add('hidden');
            }, 300);
        }

        function formatRupiah(n) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(Math.abs(n)); }
    </script>
