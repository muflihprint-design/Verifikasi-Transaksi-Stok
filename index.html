<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Muflih Print - Inventory & Sales</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); min-height: 100vh; font-family: sans-serif; }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 1rem; }
    .nav-btn { color: #64748b; font-weight: 500; transition: all 0.2s; border-top: 2px solid transparent; }
    .nav-btn.active { color: #6366f1; border-top: 2px solid #6366f1; background: rgba(99, 102, 241, 0.05); }
    .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .modal-overlay { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }
    
    .item-card { border-left-width: 4px; transition: all 0.3s ease; }
    .item-card.status-masuk { border-left-color: #10b981; background: white; }
    .item-card.status-abaikan { border-left-color: #ef4444; background: #fff1f2; opacity: 0.8; }
    .item-card.status-none { border-left-color: #cbd5e1; background: #f8fafc; }
    
    .status-processed { background: #dcfce7; color: #15803d; }
    .status-pending { background: #fef9c3; color: #854d0e; }
    
    .btn-status { width: 32px; height: 32px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-size: 0.75rem; }
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-6xl mx-auto glass-card shadow-2xl overflow-hidden">
    <!-- Navigation Tabs -->
    <div class="flex border-b">
      <button onclick="switchTab('stok')" id="tab-stok" class="nav-btn active flex-1 py-4 text-sm md:text-base">
        <i class="fas fa-boxes mr-2"></i>Stok Barang
      </button>
      <button onclick="switchTab('penjualan')" id="tab-penjualan" class="nav-btn flex-1 py-4 text-sm md:text-base">
        <i class="fas fa-shopping-cart mr-2"></i>Daftar Penjualan
      </button>
    </div>

    <!-- Content: Stok -->
    <div id="content-stok" class="p-4 md:p-6">
      <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <h2 class="text-2xl font-bold text-slate-800">Manajemen Stok</h2>
        <div class="relative w-full md:w-64">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
            <i class="fas fa-search"></i>
          </span>
          <input type="text" id="searchStok" onkeyup="filterTableStok()" placeholder="Cari produk..." 
            class="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
      </div>
      
      <div class="table-container">
        <table id="mainTableStok" class="w-full text-left">
          <thead class="bg-slate-50 text-slate-600 uppercase text-xs font-semibold">
            <tr>
              <th class="px-4 py-3">Produk</th>
              <th class="px-4 py-3">Stok Saat Ini</th>
              <th class="px-4 py-3">Update Terakhir</th>
            </tr>
          </thead>
          <tbody id="stokBody" class="divide-y divide-slate-100 text-slate-700">
            <tr><td colspan="3" class="px-4 py-8 text-center text-slate-400">Memuat data stok...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Content: Penjualan -->
    <div id="content-penjualan" class="p-4 md:p-6 hidden">
      <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <h2 class="text-2xl font-bold text-slate-800">Daftar Transaksi Penjualan</h2>
        <button onclick="fetchPenjualanData()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm transition">
          <i class="fas fa-sync-alt mr-2" id="syncIconPenjualan"></i>Refresh Data
        </button>
      </div>

      <div class="table-container">
        <table class="w-full text-left">
          <thead class="bg-slate-50 text-slate-600 uppercase text-xs font-semibold">
            <tr>
              <th class="px-4 py-3">Tanggal</th>
              <th class="px-4 py-3">No. Transaksi</th>
              <th class="px-4 py-3">Detail Barang</th>
              <th class="px-4 py-3 text-center">Status Stok</th>
            </tr>
          </thead>
          <tbody id="penjualanBody" class="divide-y divide-slate-100 text-slate-700">
            <tr><td colspan="4" class="px-4 py-8 text-center text-slate-400">Klik refresh untuk memuat data penjualan.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Edit Stok Keluar -->
  <div id="modalEdit" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all scale-95 opacity-0 duration-200" id="modalContainer">
      <div class="p-6">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xl font-bold text-slate-800">Proses Stok Keluar</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">
            <i class="fas fa-times"></i>
          </button>
        </div>
        
        <div class="mb-4 p-3 bg-indigo-50 rounded-lg">
          <p class="text-xs font-semibold text-indigo-600 uppercase mb-1">Transaksi Terkait:</p>
          <p id="modalTransactionRef" class="font-mono text-sm text-slate-700 font-bold">-</p>
        </div>

        <div id="modalItemsList" class="space-y-4 mb-6 max-h-80 overflow-y-auto pr-2">
          <!-- Daftar item akan diisi di sini -->
        </div>

        <div class="flex flex-col gap-3 border-t pt-4">
          <button onclick="submitStokKeluar()" id="btnSubmitModal" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition flex items-center justify-center shadow-lg shadow-indigo-200 disabled:bg-slate-400 disabled:shadow-none">
            <i class="fas fa-save mr-2"></i> Simpan Item Terpilih
          </button>
          <button onclick="closeModal()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-2 rounded-lg transition">
            Batal
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 px-6 py-3 rounded-lg shadow-lg transform translate-y-20 transition-all duration-300 opacity-0 bg-slate-800 text-white z-50">
    <span id="toastMsg">Pesan</span>
  </div>

  <script>
    const SHEET_READ_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRvAQXltAVp8lnrXXVVPJr1hYEi8cAJrqz182qT23eaiI8t-MoBrEtE7bAAJqKEyKKTig4hpA9DNuQB/pub?gid=2057149863&single=true&output=csv";
    const SCRIPT_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxbe8D9HCTD10N6bmEj6xi_G5fx7OHkz3-Fw02r6A7W3rnSpipJn23BS8a29_pwMKAdnw/exec"; 

    let currentSelectedTransaction = null;
    let processedInvoices = new Set(); 
    let storedItemsLog = new Set(); 
    let isSubmitting = false;

    function switchTab(tab) {
      document.getElementById('content-stok').classList.toggle('hidden', tab !== 'stok');
      document.getElementById('content-penjualan').classList.toggle('hidden', tab !== 'penjualan');
      document.getElementById('tab-stok').classList.toggle('active', tab === 'stok');
      document.getElementById('tab-penjualan').classList.toggle('active', tab === 'penjualan');
      if (tab === 'penjualan' && !window.penjualanLoaded) fetchPenjualanData();
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add(isError ? 'bg-red-600' : 'bg-slate-800');
      setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
    }

    function openModalWithTransaction(invoice, jsonStr) {
      if (isSubmitting) return;
      const modal = document.getElementById('modalEdit');
      const container = document.getElementById('modalContainer');
      const itemsList = document.getElementById('modalItemsList');
      const refText = document.getElementById('modalTransactionRef');

      refText.innerText = invoice;
      itemsList.innerHTML = '';
      
      try {
        const items = JSON.parse(jsonStr);
        const filteredItems = items.filter(item => !storedItemsLog.has(`${invoice}|${item.nama}`));
        
        currentSelectedTransaction = { invoice, items: filteredItems };

        if (filteredItems.length === 0) {
          itemsList.innerHTML = `<div class="text-center py-10">
            <i class="fas fa-check-circle text-emerald-500 text-4xl mb-3"></i>
            <p class="text-slate-500 text-sm">Semua item dalam transaksi ini sudah berhasil disimpan ke Spreadsheet.</p>
          </div>`;
          document.getElementById('btnSubmitModal').classList.add('hidden');
        } else {
          document.getElementById('btnSubmitModal').classList.remove('hidden');
          filteredItems.forEach((item, index) => {
            const itemDiv = document.createElement('div');
            itemDiv.id = `item-card-${index}`;
            itemDiv.className = "item-card border rounded-lg p-3 shadow-sm transition-all duration-200 status-none";
            itemDiv.dataset.status = "none";
            
            itemDiv.innerHTML = `
              <div class="flex justify-between items-start mb-3">
                <div class="flex flex-col">
                  <span class="font-bold text-slate-800 text-sm">${item.nama}</span>
                  <span class="text-[10px] text-slate-500">Order: <span class="font-bold">${item.qty}</span></span>
                </div>
                <div class="flex gap-2">
                   <button onclick="setItemStatus(${index}, 'masuk')" id="btn-masuk-${index}" title="Simpan ke Sheet (Gunakan Stok)"
                      class="btn-status bg-slate-100 text-slate-400 hover:bg-emerald-100 hover:text-emerald-600">
                      <i class="fas fa-check"></i>
                   </button>
                   <button onclick="setItemStatus(${index}, 'abaikan')" id="btn-abaikan-${index}" title="Simpan ke Sheet (Abaikan/Tanpa Kurangi Stok)"
                      class="btn-status bg-slate-100 text-slate-400 hover:bg-red-100 hover:text-red-600">
                      <i class="fas fa-times"></i>
                   </button>
                   <button onclick="setItemStatus(${index}, 'none')" id="btn-none-${index}" title="Belum Diputuskan"
                      class="btn-status bg-slate-200 text-slate-600 ring-2 ring-slate-400">
                      <i class="fas fa-minus"></i>
                   </button>
                </div>
              </div>
              <div class="flex items-center gap-3">
                <label class="text-[10px] text-slate-500 font-semibold uppercase">Qty Keluar:</label>
                <input type="number" value="${item.qty}" min="1" data-index="${index}" id="input-qty-${index}"
                  class="qty-input w-20 px-2 py-1 border-2 border-slate-200 rounded focus:border-indigo-500 outline-none font-bold text-slate-700 text-sm">
              </div>
            `;
            itemsList.appendChild(itemDiv);
          });
        }

      } catch (e) {
        itemsList.innerHTML = `<p class="text-red-500 text-sm">Data transaksi tidak valid.</p>`;
      }

      modal.classList.remove('hidden');
      setTimeout(() => {
        container.classList.remove('scale-95', 'opacity-0');
        container.classList.add('scale-100', 'opacity-100');
      }, 10);
    }

    function setItemStatus(index, status) {
      const card = document.getElementById(`item-card-${index}`);
      const input = document.getElementById(`input-qty-${index}`);
      const btnMasuk = document.getElementById(`btn-masuk-${index}`);
      const btnAbaikan = document.getElementById(`btn-abaikan-${index}`);
      const btnNone = document.getElementById(`btn-none-${index}`);

      [btnMasuk, btnAbaikan, btnNone].forEach(btn => {
        btn.classList.remove('ring-2', 'ring-emerald-500', 'ring-red-500', 'ring-slate-400', 'bg-emerald-100', 'text-emerald-600', 'bg-red-100', 'text-red-600', 'bg-slate-200', 'text-slate-600');
        btn.classList.add('bg-slate-100', 'text-slate-400');
      });
      card.classList.remove('status-masuk', 'status-abaikan', 'status-none');
      card.dataset.status = status;

      if (status === 'masuk') {
        card.classList.add('status-masuk');
        btnMasuk.classList.remove('bg-slate-100', 'text-slate-400');
        btnMasuk.classList.add('bg-emerald-100', 'text-emerald-600', 'ring-2', 'ring-emerald-500');
        input.disabled = false;
        input.classList.replace('text-slate-700', 'text-emerald-600');
      } else if (status === 'abaikan') {
        card.classList.add('status-abaikan');
        btnAbaikan.classList.remove('bg-slate-100', 'text-slate-400');
        btnAbaikan.classList.add('bg-red-100', 'text-red-600', 'ring-2', 'ring-red-500');
        input.disabled = true;
      } else {
        card.classList.add('status-none');
        btnNone.classList.remove('bg-slate-100', 'text-slate-400');
        btnNone.classList.add('bg-slate-200', 'text-slate-600', 'ring-2', 'ring-slate-400');
        input.disabled = false;
        input.classList.replace('text-emerald-600', 'text-slate-700');
      }
    }

    function closeModal() {
      if (isSubmitting) return;
      const container = document.getElementById('modalContainer');
      container.classList.remove('scale-100', 'opacity-100');
      container.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        document.getElementById('modalEdit').classList.add('hidden');
      }, 200);
    }

    async function submitStokKeluar() {
      if (isSubmitting) return;
      
      const itemCards = document.querySelectorAll('.item-card');
      const dataToShip = [];
      const invoiceNo = currentSelectedTransaction.invoice;
      const timestamp = new Date().toLocaleString('id-ID');
      
      let markedCount = 0;
      let itemsProcessedNow = [];

      itemCards.forEach((card, index) => {
        const input = document.getElementById(`input-qty-${index}`);
        const itemName = currentSelectedTransaction.items[index].nama;
        const currentStatus = card.dataset.status;
        
        if (currentStatus !== 'none') {
            markedCount++;
            const qty = parseInt(input.value) || 0;
            
            if (currentStatus === 'masuk') {
                dataToShip.push([timestamp, invoiceNo, itemName, qty, "MASUK RIWAYAT"]);
            } else if (currentStatus === 'abaikan') {
                // Item diabaikan tetap dikirim ke spreadsheet dengan keterangan khusus
                dataToShip.push([timestamp, invoiceNo, itemName, qty, "DIABAIKAN"]);
            }
            itemsProcessedNow.push(itemName);
        }
      });

      if (markedCount === 0) {
        showToast("Mohon tandai minimal satu item (Centang atau Silang)", true);
        return;
      }

      setLoading(true);

      try {
        await fetch(SCRIPT_WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dataToShip)
        });
        
        // Simpan ke log lokal agar tidak muncul lagi di modal
        itemsProcessedNow.forEach(name => storedItemsLog.add(`${invoiceNo}|${name}`));
        
        // Cek apakah semua item dari invoice asli sudah diproses
        const originalRow = window.lastSalesData.find(r => r[0] === invoiceNo);
        if (originalRow) {
          try {
            const originalItems = JSON.parse(originalRow[10]);
            const allDone = originalItems.every(it => storedItemsLog.has(`${invoiceNo}|${it.nama}`));
            if (allDone) processedInvoices.add(invoiceNo);
          } catch(e) {}
        }

        renderPenjualan(window.lastSalesData);
        showToast(`Berhasil menyimpan ${dataToShip.length} data ke Spreadsheet.`);
        setLoading(false);
        closeModal();
      } catch (err) {
        showToast("Gagal menyimpan data", true);
        setLoading(false);
      }
    }

    function setLoading(loading) {
      isSubmitting = loading;
      const btn = document.getElementById('btnSubmitModal');
      if (loading) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner animate-spin mr-2"></i> Menyimpan...';
      } else {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save mr-2"></i> Simpan Item Terpilih';
      }
    }

    async function fetchPenjualanData() {
      const icon = document.getElementById('syncIconPenjualan');
      const body = document.getElementById('penjualanBody');
      icon.classList.add('animate-spin');
      body.innerHTML = `<tr><td colspan="4" class="px-4 py-8 text-center text-slate-400 italic">Mengambil data penjualan...</td></tr>`;

      try {
        const response = await fetch(SHEET_READ_URL);
        const csvText = await response.text();
        const rows = parseCSV(csvText);
        window.lastSalesData = rows.slice(1).filter(row => row[3] && row[3].trim().toLowerCase() === 'penjualan');
        
        renderPenjualan(window.lastSalesData);
        window.penjualanLoaded = true;
      } catch (err) {
        showToast("Gagal mengambil data", true);
      } finally {
        icon.classList.remove('animate-spin');
      }
    }

    function parseCSV(text) {
      const lines = text.split(/\r?\n/);
      return lines.map(line => {
        const result = [];
        let cur = '', inQuote = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"' && line[i+1] === '"') { cur += '"'; i++; }
          else if (char === '"') inQuote = !inQuote;
          else if (char === ',' && !inQuote) { result.push(cur); cur = ''; }
          else cur += char;
        }
        result.push(cur);
        return result;
      });
    }

    function renderPenjualan(data) {
      const body = document.getElementById('penjualanBody');
      if (data.length === 0) {
        body.innerHTML = `<tr><td colspan="4" class="px-4 py-8 text-center text-slate-400 italic">Tidak ada data.</td></tr>`;
        return;
      }
      
      body.innerHTML = data.map(row => {
        const invoice = row[0];
        const jsonDetail = row[10];
        const isProcessed = processedInvoices.has(invoice);

        return `
          <tr onclick='openModalWithTransaction("${invoice}", ${JSON.stringify(jsonDetail).replace(/'/g, "&apos;")})' 
              class="hover:bg-indigo-50 cursor-pointer transition border-b border-slate-50 group ${isProcessed ? 'bg-slate-50/50 opacity-80' : ''}">
            <td class="px-4 py-4 text-sm whitespace-nowrap">${row[1]}</td>
            <td class="px-4 py-4 font-mono text-xs text-indigo-600 font-bold">${invoice}</td>
            <td class="px-4 py-4 text-sm">${parseDetail(invoice, jsonDetail)}</td>
            <td class="px-4 py-4 text-center">
              <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase ${isProcessed ? 'status-processed' : 'status-pending'}">
                ${isProcessed ? '<i class="fas fa-check-circle mr-1"></i>Selesai' : '<i class="fas fa-clock mr-1"></i>Antrean'}
              </span>
            </td>
          </tr>
        `;
      }).join('');
    }

    function parseDetail(invoice, json) {
      try {
        const items = JSON.parse(json);
        return items.map(i => {
          const isDone = storedItemsLog.has(`${invoice}|${i.nama}`);
          return `<div class="mb-1 text-xs ${isDone ? 'line-through text-slate-400' : ''}">
            <span class="font-semibold">${i.nama}</span> (${i.qty}) 
            ${isDone ? '<i class="fas fa-check ml-1 text-emerald-500"></i>' : ''}
          </div>`;
        }).join('');
      } catch (e) { return `<span class="text-slate-400 italic">Data tidak valid</span>`; }
    }

    function filterTableStok() {
      const filter = document.getElementById("searchStok").value.toUpperCase();
      const tr = document.getElementById("stokBody").getElementsByTagName("tr");
      for (let i = 0; i < tr.length; i++) {
        const td = tr[i].getElementsByTagName("td")[0];
        if (td) tr[i].style.display = td.innerText.toUpperCase().includes(filter) ? "" : "none";
      }
    }

    window.onload = () => {
      const stokBody = document.getElementById('stokBody');
      const mockData = [
        { name: "Kertas F4 70gr", stock: 120, updated: "Baru saja" },
        { name: "Tinta Epson 003 Black", stock: 15, updated: "1 jam lalu" }
      ];
      stokBody.innerHTML = mockData.map(item => `
        <tr class="hover:bg-slate-50 transition">
          <td class="px-4 py-4 font-medium text-slate-800">${item.name}</td>
          <td class="px-4 py-4 font-bold text-indigo-600">${item.stock}</td>
          <td class="px-4 py-4 text-xs text-slate-400">${item.updated}</td>
        </tr>
      `).join('');
    };
  </script>
</body>
</html>
