<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Muflih Print - Verifikasi Logistik</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
    
    body { 
      background: #f8fafc; 
      font-family: 'Plus Jakarta Sans', sans-serif;
      overscroll-behavior-y: contain;
    }

    .nota-card.verified { 
      opacity: 0.7; 
      border-color: #10b981 !important; 
      background-color: #f0fdf4; 
    }

    .nota-card.partial {
      border-color: #f59e0b !important;
      background-color: #fffbeb;
    }

    .nota-card.insufficient {
      border-left: 4px solid #ef4444;
    }

    .fisik-item-select.selected { 
      border-color: #6366f1; 
      background-color: #f5f3ff; 
    }

    .tab-active { color: #4f46e5; }
    .tab-active i { transform: translateY(-4px); transition: transform 0.2s ease; }
    .animate-in { animation: fadeIn 0.3s ease-out forwards; }
    
    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(10px); } 
      to { opacity: 1; transform: translateY(0); } 
    }

    .content-area { 
      padding-bottom: 250px; 
    }

    .stok-badge {
        background: linear-gradient(135deg, #6366f1, #4338ca);
        color: white;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 10px;
        font-weight: 800;
    }
    
    .insufficient-badge {
        background: #fee2e2;
        color: #ef4444;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 8px;
        font-weight: 900;
        text-transform: uppercase;
    }

    .partial-badge {
        background: #fef3c7;
        color: #d97706;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 8px;
        font-weight: 900;
        text-transform: uppercase;
    }

    .custom-checkbox {
        width: 20px;
        height: 20px;
        border: 2px solid #cbd5e1;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
    }
    .custom-checkbox.active {
        background: #4f46e5;
        border-color: #4f46e5;
    }
    .custom-checkbox i {
        color: white;
        font-size: 10px;
        display: none;
    }
    .custom-checkbox.active i {
        display: block;
    }

    .scroll-spacer {
        height: 200px;
        width: 100%;
        pointer-events: none;
    }
  </style>
</head>
<body class="text-slate-900 min-h-screen">

  <nav class="bg-white border-b sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md">
          <i class="fas fa-layer-group text-sm"></i>
        </div>
        <div>
          <h1 id="pageTitle" class="font-extrabold text-slate-800 text-sm uppercase tracking-tight">Nota Transaksi</h1>
          <div id="syncStatus" class="hidden flex items-center gap-1 text-emerald-600 text-[8px] font-black uppercase">
             <i class="fas fa-sync-alt animate-spin"></i> Sinkronisasi...
          </div>
        </div>
      </div>
      <button onclick="fetchAllData()" class="w-10 h-10 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center active:bg-indigo-100 transition-colors">
        <i id="refreshIcon" class="fas fa-sync-alt"></i>
      </button>
    </div>

    <div class="px-4 pb-3">
      <div class="relative group">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <i class="fas fa-search text-slate-400 text-xs"></i>
        </div>
        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Cari barang atau pelanggan..." 
          class="w-full pl-9 pr-4 py-2.5 bg-slate-100 border-transparent rounded-xl text-xs font-semibold focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all outline-none">
      </div>
    </div>
  </nav>

  <main class="content-area p-4">
    <div id="pageNota" class="space-y-3">
        <div class="flex items-center justify-between px-1 mb-2">
            <div class="flex items-center gap-2">
              <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Antrean Verifikasi</span>
              <span id="countNota" class="text-[10px] font-black text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">0</span>
            </div>
            <button onclick="toggleSelectAll()" id="btnSelectAll" class="text-[10px] font-black text-indigo-600 uppercase">Pilih Semua</button>
        </div>
        <div id="containerNota" class="space-y-3"></div>
    </div>

    <div id="pageGudang" class="hidden space-y-3">
        <div class="flex items-center justify-between px-1 mb-2">
            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Stok Gudang (Aktif)</span>
            <span id="countFisik" class="text-[10px] font-black text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="containerFisik" class="space-y-3"></div>
    </div>
  </main>

  <!-- Bulk Action Bar -->
  <div id="bulkActionBar" class="fixed bottom-24 left-4 right-4 bg-slate-900 text-white p-4 rounded-2xl shadow-2xl z-[55] hidden flex items-center justify-between animate-in">
    <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-500 rounded-xl flex items-center justify-center font-black text-lg" id="bulkCount">0</div>
        <div>
            <p class="text-[10px] font-black uppercase opacity-70">Nota Terpilih</p>
            <p class="text-xs font-bold">Verifikasi Massal</p>
        </div>
    </div>
    <button onclick="submitBulkVerifikasi()" id="btnBulkAction" class="bg-indigo-600 px-6 py-2.5 rounded-xl font-black text-xs uppercase tracking-widest hover:bg-indigo-500 active:scale-95 transition-all">
        Selesaikan Semua
    </button>
  </div>

  <footer class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-100 px-6 py-3 z-50 shadow-[0_-4px_10px_rgba(0,0,0,0.03)] flex justify-around items-center">
    <button onclick="switchTab('nota')" id="tabNota" class="flex flex-col items-center gap-1 tab-active transition-all flex-1">
      <i class="fas fa-file-invoice-dollar text-xl"></i>
      <span class="text-[10px] font-extrabold uppercase tracking-tighter">Nota</span>
    </button>
    <div class="w-px h-6 bg-slate-100"></div>
    <button onclick="switchTab('gudang')" id="tabGudang" class="flex flex-col items-center gap-1 text-slate-400 transition-all flex-1">
      <i class="fas fa-box-open text-xl"></i>
      <span class="text-[10px] font-extrabold uppercase tracking-tighter">Gudang</span>
    </button>
  </footer>

  <div id="modalVerify" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] hidden flex flex-col justify-end">
    <div class="bg-white w-full rounded-t-[32px] overflow-hidden shadow-2xl transition-all translate-y-full duration-300 flex flex-col max-h-[95vh]" id="modalContent">
      <div onclick="closeModal()" class="w-full flex justify-center py-3 cursor-pointer">
          <div class="w-12 h-1.5 bg-slate-200 rounded-full"></div>
      </div>
      <div id="vNotaHeader" class="mx-4 p-5 rounded-2xl text-white shadow-lg">
        <p class="text-[9px] font-black uppercase opacity-70 tracking-widest">Verifikasi Item Nota</p>
        <h4 id="vNotaName" class="text-lg font-black leading-tight mb-1 truncate">...</h4>
        <div class="flex items-center gap-3">
          <div class="text-2xl font-black"><span id="vNotaQty">0</span> <span class="text-xs opacity-60">pcs</span></div>
          <div class="h-4 w-px bg-white/20"></div>
          <p id="vNotaDetail" class="text-[10px] opacity-80 uppercase font-bold truncate">...</p>
        </div>
      </div>
      <div class="flex-1 overflow-y-auto p-5 space-y-4">
        <div class="flex items-center justify-between">
            <h5 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Pilih Stok Gudang</h5>
            <span id="vTargetType" class="text-[8px] font-black px-2 py-0.5 rounded uppercase"></span>
        </div>
        <div id="matchingFisikList" class="space-y-3 pb-4"></div>
        <div id="noMatchMsg" class="hidden text-center py-12 bg-slate-50 rounded-2xl border-2 border-dashed">
          <i class="fas fa-ghost text-2xl text-slate-200 mb-2 block"></i>
          <p class="text-xs font-bold text-slate-400">Tidak ada stok yang cocok.</p>
        </div>
      </div>
      <div class="p-5 bg-slate-50 border-t space-y-3 pb-8">
        <div id="selectionSummary" class="hidden p-3 bg-white rounded-xl border flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div id="diffIcon" class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs"></div>
                <div>
                    <p id="summaryTitle" class="text-[10px] font-black"></p>
                    <p id="summaryDesc" class="text-[9px] text-slate-400 font-medium"></p>
                </div>
            </div>
            <div id="vSelectedQty" class="text-lg font-black">0</div>
        </div>
        <button id="btnAction" disabled onclick="submitVerifikasi()" class="w-full py-4 bg-slate-200 text-slate-400 font-black rounded-2xl transition-all uppercase tracking-widest text-sm shadow-md">
            Pilih Stok Gudang
        </button>
      </div>
    </div>
  </div>

  <script>
    const CSV_URL = `https://docs.google.com/spreadsheets/d/e/2PACX-1vRvAQXltAVp8lnrXXVVPJr1hYEi8cAJrqz182qT23eaiI8t-MoBrEtE7bAAJqKEyKKTig4hpA9DNuQB/pub?gid=2057149863&single=true&output=csv`;
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXIVX820y1uVxrNFcfV080aAQWFzIvde2xKSEZXczfg3hq1CI18RX-Xu6DohcacF94/exec";
    const SUPABASE_URL = "https://zqxeoveanevsvynptckm.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxeGVvdmVhbmV2c3Z5bnB0Y2ttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyNzUzODEsImV4cCI6MjA4OTg1MTM4MX0.eeIaytpW1wtWPJc2FbhufkDkhONUt9yypTZU4dTVmsM";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let listItemsNota = []; 
    let listFisik = [];
    let verifiedLogs = []; 
    let selectedNota = null;
    let selectedFisik = null;
    let searchTerm = "";
    let selectedBulkIds = new Set();

    function switchTab(tab) {
      const pageNota = document.getElementById('pageNota');
      const pageGudang = document.getElementById('pageGudang');
      const tabNota = document.getElementById('tabNota');
      const tabGudang = document.getElementById('tabGudang');
      const pageTitle = document.getElementById('pageTitle');

      if (tab === 'nota') {
        pageNota.classList.remove('hidden');
        pageGudang.classList.add('hidden');
        tabNota.classList.add('tab-active');
        tabNota.classList.remove('text-slate-400');
        tabGudang.classList.remove('tab-active');
        tabGudang.classList.add('text-slate-400');
        pageTitle.innerText = "Nota Transaksi";
      } else {
        pageNota.classList.add('hidden');
        pageGudang.classList.remove('hidden');
        tabGudang.classList.add('tab-active');
        tabGudang.classList.remove('text-slate-400');
        tabNota.classList.remove('tab-active');
        tabNota.classList.add('text-slate-400');
        pageTitle.innerText = "Log Gudang";
      }
      window.scrollTo(0,0);
    }

    function calculateRemainingStock(fisikId, initialQty) {
        const usedAmount = verifiedLogs
            .filter(log => String(log.fisikId) === String(fisikId))
            .reduce((sum, log) => sum + parseInt(log.qtyNota || 0), 0);
        return initialQty - usedAmount;
    }

    function calculateVerifiedQtyForNota(notaId) {
        return verifiedLogs
            .filter(log => String(log.notaId) === String(notaId))
            .reduce((sum, log) => sum + parseInt(log.qtyNota || 0), 0);
    }

    async function loadVerifiedLogs() {
      try {
        const res = await fetch(`${APPS_SCRIPT_URL}?action=getVerified`);
        const data = await res.json();
        if (Array.isArray(data)) {
            verifiedLogs = data;
            localStorage.setItem('cached_verified_logs', JSON.stringify(data));
        }
      } catch (e) {
        verifiedLogs = JSON.parse(localStorage.getItem('cached_verified_logs') || '[]'); 
      }
    }

    async function loadNota() {
      try {
        const res = await fetch(CSV_URL);
        const text = await res.text();
        const rows = text.split('\n').slice(1);
        listItemsNota = []; 

        rows.forEach((r) => {
          const parts = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
          if (parts.length < 11) return;

          const idTrx = parts[0].trim();
          const tgl = parts[1];
          const pelanggan = parts[2];
          const kategori = parts[3]?.trim(); 
          let jsonString = parts[10];

          if ((kategori === "Pembelian" || kategori === "Penjualan") && jsonString) {
            try {
              let cleanJson = jsonString.trim();
              if (cleanJson.startsWith('"') && cleanJson.endsWith('"')) cleanJson = cleanJson.substring(1, cleanJson.length - 1);
              cleanJson = cleanJson.replace(/""/g, '"');
              const items = JSON.parse(cleanJson);
              if (Array.isArray(items)) {
                items.forEach((item, itemIdx) => {
                  listItemsNota.push({
                    uniqueId: `N-${idTrx}-${itemIdx}`,
                    idTrx: idTrx, tgl: tgl, pelanggan: pelanggan,
                    namaItem: item.nama || "Item",
                    qty: parseInt(item.qty || 0),
                    kategori: kategori
                  });
                });
              }
            } catch (e) {}
          }
        });
        renderNota();
      } catch (e) {}
    }

    async function loadFisik() {
      try {
        const { data, error } = await _supabase.from('riwayat').select('*').order('created_at', { ascending: false });
        if(error) throw error;
        listFisik = data || [];
        renderFisik();
      } catch (e) {}
    }

    function handleSearch() {
      searchTerm = document.getElementById('searchInput').value.toLowerCase();
      renderNota();
      renderFisik();
    }

    function toggleSelectAll() {
        const filtered = listItemsNota.filter(n => {
            const verifiedQty = calculateVerifiedQtyForNota(n.uniqueId);
            const isFullyVerified = verifiedQty >= n.qty;
            const matchesSearch = n.namaItem.toLowerCase().includes(searchTerm) || 
                                  n.pelanggan.toLowerCase().includes(searchTerm) ||
                                  n.idTrx.toLowerCase().includes(searchTerm);
            return !isFullyVerified && matchesSearch;
        });

        if (selectedBulkIds.size === filtered.length) {
            selectedBulkIds.clear();
        } else {
            filtered.forEach(n => selectedBulkIds.add(n.uniqueId));
        }
        updateBulkUI();
        renderNota();
    }

    function toggleBulkSelect(id) {
        if (selectedBulkIds.has(id)) selectedBulkIds.delete(id);
        else selectedBulkIds.add(id);
        updateBulkUI();
        renderNota();
    }

    function updateBulkUI() {
        const bar = document.getElementById('bulkActionBar');
        const count = document.getElementById('bulkCount');
        const btnAll = document.getElementById('btnSelectAll');

        if (selectedBulkIds.size > 0) {
            bar.classList.remove('hidden');
            count.innerText = selectedBulkIds.size;
            btnAll.innerText = "Batal Pilih";
        } else {
            bar.classList.add('hidden');
            btnAll.innerText = "Pilih Semua";
        }
    }

    function renderNota() {
      const container = document.getElementById('containerNota');
      const filtered = listItemsNota.filter(n => 
        n.namaItem.toLowerCase().includes(searchTerm) || 
        n.pelanggan.toLowerCase().includes(searchTerm) ||
        n.idTrx.toLowerCase().includes(searchTerm)
      );

      document.getElementById('countNota').innerText = filtered.length;

      if(filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-20 text-slate-300 italic text-xs">Nota tidak ditemukan.</div>`;
        return;
      }

      let html = filtered.map(n => {
        const verifiedQty = calculateVerifiedQtyForNota(n.uniqueId);
        const isFullyVerified = verifiedQty >= n.qty;
        const isPartiallyVerified = verifiedQty > 0 && verifiedQty < n.qty;
        const remainingToVerify = n.qty - verifiedQty;
        const isBulkSelected = selectedBulkIds.has(n.uniqueId);
        
        const targetFisikType = n.kategori === 'Penjualan' ? 'Barang Keluar' : 'Barang Masuk';
        const query = n.namaItem.toLowerCase().split(' ')[0];
        const totalAvailable = listFisik
            .filter(f => f.jenis === targetFisikType && (f.nama_barang.toLowerCase().includes(query) || n.namaItem.toLowerCase().includes(f.nama_barang.toLowerCase().split(' ')[0])))
            .reduce((sum, f) => sum + calculateRemainingStock(f.id, f.jumlah), 0);
        
        const isInsufficient = !isFullyVerified && totalAvailable < remainingToVerify;
        
        let cardClass = "bg-white p-4 rounded-2xl border border-slate-100 shadow-sm animate-in transition-all relative overflow-hidden";
        if (isFullyVerified) cardClass = "nota-card verified animate-in bg-white p-4 rounded-2xl border border-slate-100 shadow-sm";
        else if (isPartiallyVerified) cardClass = "nota-card partial animate-in bg-white p-4 rounded-2xl border border-slate-100 shadow-sm transition-all";
        
        if (isInsufficient) cardClass += " insufficient";
        if (isBulkSelected) cardClass += " border-indigo-500 bg-indigo-50/30 ring-2 ring-indigo-500/20";

        return `
          <div class="${cardClass}">
            <div class="flex justify-between items-start mb-2">
              <div class="flex gap-2 items-center flex-wrap">
                ${!isFullyVerified ? `
                  <div onclick="toggleBulkSelect('${n.uniqueId}')" class="custom-checkbox ${isBulkSelected ? 'active' : ''} mr-1">
                    <i class="fas fa-check"></i>
                  </div>
                ` : ''}
                <span class="text-[8px] px-2 py-0.5 rounded ${n.kategori === 'Penjualan' ? 'bg-blue-100 text-blue-600' : 'bg-orange-100 text-orange-600'} font-black uppercase tracking-widest">${n.kategori}</span>
                ${isInsufficient ? '<span class="insufficient-badge">Stok Kurang</span>' : ''}
                ${isPartiallyVerified ? '<span class="partial-badge">Belum Sesuai</span>' : ''}
              </div>
              ${isFullyVerified ? 
                '<span class="text-[9px] font-black text-emerald-600 uppercase italic"><i class="fas fa-check-circle"></i> Selesai</span>' : 
                `<span class="text-[8px] font-bold text-slate-400 uppercase tracking-tighter">${n.tgl}</span>`
              }
            </div>
            
            <div onclick="${isFullyVerified ? '' : `openSmartVerify('${n.uniqueId}')`}" class="cursor-pointer">
                <div class="font-extrabold text-slate-800 leading-tight text-sm">${n.namaItem}</div>
                
                ${isPartiallyVerified ? `
                    <div class="mt-2 flex items-center gap-2">
                        <div class="flex-1 h-1 bg-slate-100 rounded-full overflow-hidden">
                            <div class="h-full bg-amber-500" style="width: ${(verifiedQty / n.qty) * 100}%"></div>
                        </div>
                        <span class="text-[8px] font-black text-amber-600">${verifiedQty}/${n.qty}</span>
                    </div>
                ` : ''}

                <div class="flex justify-between items-center mt-3">
                  <div class="text-[9px] font-bold text-slate-400 truncate max-w-[150px] uppercase">${n.pelanggan}</div>
                  <div class="text-right">
                    ${isPartiallyVerified ? `<div class="text-[8px] font-bold text-slate-400 line-through">${n.qty} pcs</div>` : ''}
                    <div class="text-lg font-black ${isFullyVerified ? 'text-emerald-500' : (isPartiallyVerified ? 'text-amber-600' : (isInsufficient ? 'text-red-500' : 'text-indigo-600'))}">
                        ${isPartiallyVerified ? remainingToVerify : n.qty} <span class="text-[9px]">pcs</span>
                    </div>
                  </div>
                </div>
            </div>
          </div>
        `;
      }).join('');

      html += '<div class="scroll-spacer"></div>';
      container.innerHTML = html;
    }

    function renderFisik() {
      const container = document.getElementById('containerFisik');
      const itemsWithStock = listFisik.map(f => ({
          ...f,
          sisa: calculateRemainingStock(f.id, f.jumlah)
      })).filter(f => f.sisa > 0 && (f.nama_barang.toLowerCase().includes(searchTerm) || f.jenis.toLowerCase().includes(searchTerm)));

      document.getElementById('countFisik').innerText = itemsWithStock.length;
      if(itemsWithStock.length === 0) {
        container.innerHTML = `<div class="text-center py-20 text-slate-300 italic text-xs">Semua stok gudang sudah teralokasi.</div>`;
        return;
      }

      let html = itemsWithStock.map(f => `
        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm animate-in">
          <div class="flex justify-between items-center mb-1 text-[8px] font-black uppercase tracking-widest">
            <span class="${f.jenis === 'Barang Masuk' ? 'text-emerald-500' : 'text-red-400'}">${f.jenis}</span>
            <span class="text-slate-300">ID: #${f.id}</span>
          </div>
          <div class="font-extrabold text-slate-700 text-sm truncate">${f.nama_barang}</div>
          <div class="mt-3 flex justify-between items-end">
             <div class="text-[8px] font-bold text-slate-300 uppercase italic">Input: ${new Date(f.created_at).toLocaleDateString()}</div>
             <div class="flex items-center gap-2">
                ${f.sisa < f.jumlah ? `<span class="text-[9px] text-slate-300 line-through font-bold">${f.jumlah}</span>` : ''}
                <span class="stok-badge">${f.sisa} PCS</span>
             </div>
          </div>
        </div>
      `).join('');

      html += '<div class="scroll-spacer"></div>';
      container.innerHTML = html;
    }

    function openSmartVerify(notaId) {
      selectedNota = listItemsNota.find(n => n.uniqueId === notaId);
      selectedFisik = null;
      
      const verifiedQty = calculateVerifiedQtyForNota(selectedNota.uniqueId);
      const remainingToVerify = selectedNota.qty - verifiedQty;
      selectedNota.currentRemaining = remainingToVerify;

      const header = document.getElementById('vNotaHeader');
      const targetTypeBadge = document.getElementById('vTargetType');
      const targetFisikType = selectedNota.kategori === 'Penjualan' ? 'Barang Keluar' : 'Barang Masuk';

      header.style.backgroundColor = selectedNota.kategori === 'Penjualan' ? "#4f46e5" : "#f59e0b";
      targetTypeBadge.className = `text-[8px] font-black px-2 py-0.5 rounded uppercase ${selectedNota.kategori === 'Penjualan' ? 'bg-red-50 text-red-500' : 'bg-emerald-50 text-emerald-500'}`;
      targetTypeBadge.innerText = `Target: ${targetFisikType}`;

      document.getElementById('vNotaName').innerText = selectedNota.namaItem;
      document.getElementById('vNotaQty').innerText = remainingToVerify;
      document.getElementById('vNotaDetail').innerText = `${selectedNota.pelanggan} • #${selectedNota.idTrx} ${verifiedQty > 0 ? `(Terverifikasi: ${verifiedQty})` : ''}`;
      
      const query = selectedNota.namaItem.toLowerCase().split(' ')[0]; 
      const matches = listFisik.map(f => ({
          ...f,
          sisa: calculateRemainingStock(f.id, f.jumlah)
      })).filter(f => f.sisa > 0 && f.jenis === targetFisikType && (f.nama_barang.toLowerCase().includes(query) || selectedNota.namaItem.toLowerCase().includes(f.nama_barang.toLowerCase().split(' ')[0])));

      const listContainer = document.getElementById('matchingFisikList');
      const noMatch = document.getElementById('noMatchMsg');
      const btn = document.getElementById('btnAction');
      const summary = document.getElementById('selectionSummary');

      summary.classList.add('hidden');
      btn.disabled = true;
      btn.className = "w-full py-4 bg-slate-100 text-slate-300 font-black rounded-2xl uppercase text-sm";
      btn.innerText = "Pilih Stok Gudang";

      if (matches.length > 0) {
        noMatch.classList.add('hidden');
        listContainer.innerHTML = matches.map(f => `
          <div onclick="selectFisikItem('${f.id}', ${f.sisa})" id="modal-fisik-${f.id}" class="fisik-item-select p-4 bg-white border border-slate-100 rounded-2xl active:scale-[0.98] transition-all flex justify-between items-center group">
            <div class="flex-1 min-w-0 pr-4">
               <div class="flex items-center gap-2 mb-0.5">
                 <span class="text-[7px] font-black uppercase px-1.5 py-0.5 rounded bg-slate-100 text-slate-400">#${f.id}</span>
                 ${f.sisa < f.jumlah ? '<span class="text-[7px] font-black text-amber-500 uppercase italic">Terpakai Sebagian</span>' : ''}
               </div>
               <div class="font-extrabold text-slate-700 text-sm truncate">${f.nama_barang}</div>
               <div class="text-[9px] text-slate-400 font-bold">${new Date(f.created_at).toLocaleDateString()}</div>
            </div>
            <div class="text-right">
                <div class="text-xl font-black ${f.sisa < remainingToVerify ? 'text-red-500' : 'text-indigo-600'}">${f.sisa}</div>
                <div class="text-[8px] font-black text-slate-300 uppercase tracking-tighter">PCS SISA</div>
            </div>
          </div>
        `).join('');
      } else {
        listContainer.innerHTML = '';
        noMatch.classList.remove('hidden');
      }

      document.getElementById('modalVerify').classList.remove('hidden');
      setTimeout(() => document.getElementById('modalContent').classList.remove('translate-y-full'), 10);
    }

    function selectFisikItem(fisikId, sisaStok) {
      selectedFisik = listFisik.find(f => f.id == fisikId);
      selectedFisik.sisaReal = sisaStok; 

      document.querySelectorAll('.fisik-item-select').forEach(el => el.classList.remove('selected', 'border-indigo-500', 'bg-indigo-50'));
      document.getElementById(`modal-fisik-${fisikId}`)?.classList.add('selected', 'border-indigo-500', 'bg-indigo-50');

      const summary = document.getElementById('selectionSummary');
      const diffQty = sisaStok - selectedNota.currentRemaining;
      
      const vQty = document.getElementById('vSelectedQty');
      const sTitle = document.getElementById('summaryTitle');
      const sDesc = document.getElementById('summaryDesc');
      const diffIcon = document.getElementById('diffIcon');
      const btn = document.getElementById('btnAction');

      summary.classList.remove('hidden');
      vQty.innerText = sisaStok;

      if (diffQty < 0) {
        diffIcon.className = "w-8 h-8 rounded-full flex items-center justify-center bg-amber-500 text-white shadow-sm";
        diffIcon.innerHTML = '<i class="fas fa-exclamation"></i>';
        sTitle.innerText = `Kurang ${Math.abs(diffQty)} pcs`;
        sTitle.className = "text-[10px] font-black text-amber-600";
        sDesc.innerText = "Nota belum sesuai. Stok fisik terserap habis.";
        btn.innerText = "Input Stok & Status Belum Sesuai";
        btn.className = "w-full py-4 bg-amber-500 text-white font-black rounded-2xl shadow-lg active:scale-95 transition-all uppercase text-sm";
      } else {
        diffIcon.className = "w-8 h-8 rounded-full flex items-center justify-center bg-emerald-500 text-white shadow-sm";
        diffIcon.innerHTML = '<i class="fas fa-check"></i>';
        sTitle.innerText = "Stok Surplus";
        sTitle.className = "text-[10px] font-black text-emerald-600";
        sDesc.innerText = `Kebutuhan nota terpenuhi. Sisa stok: ${diffQty} pcs`;
        btn.innerText = "Input Stok & Status Surplus";
        btn.className = "w-full py-4 bg-indigo-600 text-white font-black rounded-2xl shadow-lg active:scale-95 transition-all uppercase text-sm";
      }

      btn.disabled = false;
    }

    function closeModal() {
      document.getElementById('modalContent').classList.add('translate-y-full');
      setTimeout(() => document.getElementById('modalVerify').classList.add('hidden'), 300);
    }

    async function submitVerifikasi() {
      const btn = document.getElementById('btnAction');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-circle-notch animate-spin mr-2"></i> Memproses...';
      document.getElementById('syncStatus').classList.remove('hidden');

      const diffQty = selectedFisik.sisaReal - selectedNota.currentRemaining;
      const qtyTerverifikasiNota = selectedNota.currentRemaining;
      const qtyAmbilFisik = selectedFisik.sisaReal;
      
      const payload = {
        action: "verifyOne",
        notaId: String(selectedNota.uniqueId).trim(),
        fisikId: String(selectedFisik.id),
        namaItem: selectedNota.namaItem,
        qtyNota: qtyTerverifikasiNota, 
        qtyFisik: qtyAmbilFisik, 
        status: diffQty < 0 ? "Belum Sesuai" : "Surplus",
        pelanggan: selectedNota.pelanggan
      };

      try {
        await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
        verifiedLogs.push({ ...payload, qtyNota: Math.min(qtyTerverifikasiNota, qtyAmbilFisik) });
        localStorage.setItem('cached_verified_logs', JSON.stringify(verifiedLogs));
        document.getElementById('syncStatus').classList.add('hidden');
        closeModal();
        renderNota();
        renderFisik();
      } catch (e) {
        btn.disabled = false;
        btn.innerText = "Gagal, Coba Lagi";
      }
    }

    async function submitBulkVerifikasi() {
        if (selectedBulkIds.size === 0) return;
        
        const btn = document.getElementById('btnBulkAction');
        const originalText = btn.innerText;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner animate-spin"></i> Memproses...';
        document.getElementById('syncStatus').classList.remove('hidden');

        // Kumpulkan semua payload ke dalam satu array
        const batchData = Array.from(selectedBulkIds).map(id => {
            const n = listItemsNota.find(item => item.uniqueId === id);
            const remainingToVerify = n.qty - calculateVerifiedQtyForNota(n.uniqueId);
            return {
                notaId: String(n.uniqueId).trim(),
                fisikId: "MANUAL_BULK",
                namaItem: n.namaItem,
                qtyNota: remainingToVerify,
                qtyFisik: remainingToVerify,
                status: "Surplus",
                pelanggan: n.pelanggan
            };
        });

        // Buat satu payload besar untuk dikirimkan sekaligus
        const bulkPayload = {
            action: "verifyBulk",
            data: batchData
        };

        try {
            // Kirim satu request saja
            await fetch(APPS_SCRIPT_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify(bulkPayload) 
            });

            // Update local state setelah pengiriman sukses (atau dianggap sukses oleh no-cors)
            batchData.forEach(item => verifiedLogs.push(item));
            localStorage.setItem('cached_verified_logs', JSON.stringify(verifiedLogs));
            
            selectedBulkIds.clear();
            updateBulkUI();
            renderNota();
            renderFisik();
            document.getElementById('syncStatus').classList.add('hidden');
        } catch (e) {
            console.error("Gagal melakukan verifikasi massal:", e);
        } finally {
            btn.disabled = false;
            btn.innerText = originalText;
        }
    }

    async function fetchAllData() {
      const icon = document.getElementById('refreshIcon');
      if(icon) icon.classList.add('animate-spin');
      await loadVerifiedLogs();
      await Promise.all([ loadNota(), loadFisik() ]);
      if(icon) icon.classList.remove('animate-spin');
    }

    window.onload = fetchAllData;
  </script>
</body>
</html>
