<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Muflih Print - Verifikasi Logistik</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
    
    body { 
      background: #f8fafc; 
      font-family: 'Plus Jakarta Sans', sans-serif;
      overscroll-behavior-y: contain;
    }

    .tab-active { color: #4f46e5; border-bottom: 2px solid #4f46e5; }
    .tab-pembelian-active { color: #f59e0b; border-bottom: 2px solid #f59e0b; }
    
    .animate-in { animation: fadeIn 0.3s ease-out forwards; }
    
    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(10px); } 
      to { opacity: 1; transform: translateY(0); } 
    }

    .content-area { 
      padding-bottom: 250px; 
    }

    .stok-badge {
        background: linear-gradient(135deg, #6366f1, #4338ca);
        color: white;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 10px;
        font-weight: 800;
    }

    .filter-btn {
        transition: all 0.2s ease;
    }
    .filter-btn.active-penjualan {
        background-color: #4f46e5;
        color: white;
    }
    .filter-btn.active-pembelian {
        background-color: #f59e0b;
        color: white;
    }

    .custom-checkbox {
        width: 20px;
        height: 20px;
        border: 2px solid #cbd5e1;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .custom-checkbox.active { background: #4f46e5; border-color: #4f46e5; }
    .custom-checkbox.active-pembelian { background: #f59e0b; border-color: #f59e0b; }
    .custom-checkbox i { color: white; font-size: 10px; display: none; }
    .custom-checkbox.active i, .custom-checkbox.active-pembelian i { display: block; }
  </style>
</head>
<body class="text-slate-900 min-h-screen">

  <nav class="bg-white border-b sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div id="brandIcon" class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md transition-colors">
          <i class="fas fa-layer-group text-sm"></i>
        </div>
        <div>
          <h1 id="pageTitle" class="font-extrabold text-slate-800 text-sm uppercase tracking-tight">Verifikasi Penjualan</h1>
          <div id="syncStatus" class="hidden flex items-center gap-1 text-emerald-600 text-[8px] font-black uppercase">
             <i class="fas fa-sync-alt animate-spin"></i> Sinkronisasi...
          </div>
        </div>
      </div>
      <button onclick="fetchAllData()" class="w-10 h-10 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center active:bg-indigo-100 transition-colors">
        <i id="refreshIcon" class="fas fa-sync-alt"></i>
      </button>
    </div>

    <div class="flex border-b">
        <button onclick="switchCategory('Penjualan')" id="subTabPenjualan" class="flex-1 py-3 text-[10px] font-black uppercase tracking-widest tab-active">
            <i class="fas fa-arrow-up-right-from-square mr-1"></i> Penjualan
        </button>
        <button onclick="switchCategory('Pembelian')" id="subTabPembelian" class="flex-1 py-3 text-[10px] font-black uppercase tracking-widest text-slate-400">
            <i class="fas fa-arrow-down-left-and-arrow-up-right-to-center mr-1"></i> Pembelian
        </button>
    </div>

    <div class="px-4 py-3 space-y-3">
      <div class="relative group">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <i class="fas fa-search text-slate-400 text-xs"></i>
        </div>
        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Cari barang atau pelanggan..." 
          class="w-full pl-9 pr-4 py-2.5 bg-slate-100 border-transparent rounded-xl text-xs font-semibold focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all outline-none">
      </div>
      
      <div id="filterNotaBar" class="flex gap-2 overflow-x-auto pb-1">
        <button onclick="setFilter('unverified')" id="filter-unverified" class="filter-btn active-penjualan whitespace-nowrap px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-slate-100 text-slate-500">
            Belum Verifikasi
        </button>
        <button onclick="setFilter('verified')" id="filter-verified" class="filter-btn whitespace-nowrap px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-slate-100 text-slate-500">
            Sudah Verifikasi
        </button>
      </div>
    </div>
  </nav>

  <main class="content-area p-4">
    <!-- Halaman Nota -->
    <div id="pageNota" class="space-y-3">
        <div class="flex items-center justify-between px-1 mb-2">
            <div class="flex items-center gap-2">
              <span id="labelAntrean" class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Antrean Keluar</span>
              <span id="countNota" class="text-[10px] font-black text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">0</span>
            </div>
            <button onclick="toggleSelectAll()" id="btnSelectAll" class="text-[10px] font-black text-indigo-600 uppercase">Pilih Semua</button>
        </div>
        <div id="containerNota" class="space-y-3"></div>
    </div>

    <!-- Halaman Log Gudang -->
    <div id="pageGudang" class="hidden space-y-3">
        <div class="flex items-center justify-between px-1 mb-2">
            <span id="labelLogGudang" class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Log Keluar (23 Apr 2026+)</span>
            <span id="countFisik" class="text-[10px] font-black text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="containerFisik" class="space-y-3"></div>
    </div>
  </main>

  <footer class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-100 px-6 py-3 z-50 shadow-[0_-4px_10px_rgba(0,0,0,0.03)] flex justify-around items-center">
    <button onclick="switchTab('nota')" id="tabNota" class="flex flex-col items-center gap-1 tab-active transition-all flex-1 border-none bg-transparent">
      <i class="fas fa-file-invoice-dollar text-xl"></i>
      <span class="text-[10px] font-extrabold uppercase tracking-tighter">Nota</span>
    </button>
    <div class="w-px h-6 bg-slate-100"></div>
    <button onclick="switchTab('gudang')" id="tabGudang" class="flex flex-col items-center gap-1 text-slate-400 transition-all flex-1 border-none bg-transparent">
      <i class="fas fa-box-open text-xl"></i>
      <span class="text-[10px] font-extrabold uppercase tracking-tighter">Log Gudang</span>
    </button>
  </footer>

  <div id="bulkActionBar" class="fixed bottom-24 left-4 right-4 bg-slate-900 text-white p-4 rounded-2xl shadow-2xl z-[55] hidden flex items-center justify-between animate-in">
    <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-500 rounded-xl flex items-center justify-center font-black text-lg" id="bulkCount">0</div>
        <div>
            <p class="text-[10px] font-black uppercase opacity-70">Nota Terpilih</p>
            <p id="bulkLabel" class="text-xs font-bold">Verifikasi Massal</p>
        </div>
    </div>
    <button onclick="submitBulkVerifikasi()" id="btnBulkAction" class="bg-indigo-600 px-6 py-2.5 rounded-xl font-black text-xs uppercase tracking-widest hover:bg-indigo-500 active:scale-95 transition-all">
        Selesaikan
    </button>
  </div>

  <div id="modalVerify" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] hidden flex flex-col justify-end">
    <div class="bg-white w-full rounded-t-[32px] overflow-hidden shadow-2xl transition-all translate-y-full duration-300 flex flex-col max-h-[95vh]" id="modalContent">
      <div onclick="closeModal()" class="w-full flex justify-center py-3 cursor-pointer">
          <div class="w-12 h-1.5 bg-slate-200 rounded-full"></div>
      </div>
      <div id="vNotaHeader" class="mx-4 p-5 rounded-2xl text-white shadow-lg bg-indigo-600">
        <p class="text-[9px] font-black uppercase opacity-70 tracking-widest">Verifikasi Item</p>
        <h4 id="vNotaName" class="text-lg font-black leading-tight mb-1 truncate">...</h4>
        <div class="flex items-center gap-3">
          <div class="text-2xl font-black"><span id="vNotaQty">0</span> <span class="text-xs opacity-60">pcs</span></div>
          <div class="h-4 w-px bg-white/20"></div>
          <p id="vNotaDetail" class="text-[10px] opacity-80 uppercase font-bold truncate">...</p>
        </div>
      </div>
      <div class="flex-1 overflow-y-auto p-5 space-y-4">
        <h5 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Cocokan dengan Log Gudang</h5>
        <div id="matchingFisikList" class="space-y-3 pb-4"></div>
        <div id="noMatchMsg" class="hidden text-center py-12 bg-slate-50 rounded-2xl border-2 border-dashed">
          <i class="fas fa-ghost text-2xl text-slate-200 mb-2 block"></i>
          <p class="text-xs font-bold text-slate-400">Tidak ada stok yang cocok.</p>
        </div>
      </div>
      <div class="p-5 bg-slate-50 border-t space-y-3 pb-8">
        <button id="btnAction" disabled onclick="submitVerifikasi()" class="w-full py-4 bg-slate-200 text-slate-400 font-black rounded-2xl transition-all uppercase tracking-widest text-sm shadow-md">
            Pilih Log Gudang
        </button>
      </div>
    </div>
  </div>

  <script>
    const CSV_URL = `https://docs.google.com/spreadsheets/d/e/2PACX-1vRvAQXltAVp8lnrXXVVPJr1hYEi8cAJrqz182qT23eaiI8t-MoBrEtE7bAAJqKEyKKTig4hpA9DNuQB/pub?gid=2057149863&single=true&output=csv`;
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXIVX820y1uVxrNFcfV080aAQWFzIvde2xKSEZXczfg3hq1CI18RX-Xu6DohcacF94/exec";
    const SUPABASE_URL = "https://zqxeoveanevsvynptckm.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxeGVvdmVhbmV2c3Z5bnB0Y2ttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyNzUzODEsImV4cCI6MjA4OTg1MTM4MX0.eeIaytpW1wtWPJc2FbhufkDkhONUt9yypTZU4dTVmsM";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // FILTER KERAS TANGGAL
    const START_DATE = new Date("2026-04-26T00:00:00");

    let listItemsNota = []; 
    let listFisik = [];
    let verifiedLogs = []; 
    let searchTerm = "";
    let selectedBulkIds = new Set();
    
    let activeCategory = "Penjualan"; 
    let statusFilter = "unverified"; 

    function switchCategory(cat) {
        activeCategory = cat;
        selectedBulkIds.clear();
        updateBulkUI();
        
        const tabPenjualan = document.getElementById('subTabPenjualan');
        const tabPembelian = document.getElementById('subTabPembelian');
        const icon = document.getElementById('brandIcon');
        const pageTitle = document.getElementById('pageTitle');
        const labelAntrean = document.getElementById('labelAntrean');
        const labelLogGudang = document.getElementById('labelLogGudang');

        if (cat === 'Penjualan') {
            tabPenjualan.className = "flex-1 py-3 text-[10px] font-black uppercase tracking-widest tab-active";
            tabPembelian.className = "flex-1 py-3 text-[10px] font-black uppercase tracking-widest text-slate-400 border-none bg-transparent";
            icon.className = "w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md transition-colors";
            pageTitle.innerText = "Verifikasi Penjualan";
            labelAntrean.innerText = statusFilter === 'unverified' ? "Antrean Keluar" : "Riwayat Keluar";
            labelLogGudang.innerText = "Log Keluar (23 Apr 2026+)";
        } else {
            tabPenjualan.className = "flex-1 py-3 text-[10px] font-black uppercase tracking-widest text-slate-400 border-none bg-transparent";
            tabPembelian.className = "flex-1 py-3 text-[10px] font-black uppercase tracking-widest tab-pembelian-active";
            icon.className = "w-9 h-9 bg-orange-500 rounded-xl flex items-center justify-center text-white shadow-md transition-colors";
            pageTitle.innerText = "Verifikasi Pembelian";
            labelAntrean.innerText = statusFilter === 'unverified' ? "Antrean Masuk" : "Riwayat Masuk";
            labelLogGudang.innerText = "Log Masuk (23 Apr 2026+)";
        }
        updateFilterButtons();
        renderNota();
        renderFisik(); 
    }

    function setFilter(filter) {
        statusFilter = filter;
        updateFilterButtons();
        const label = document.getElementById('labelAntrean');
        if (activeCategory === 'Penjualan') {
            label.innerText = filter === 'unverified' ? "Antrean Keluar" : "Riwayat Keluar";
        } else {
            label.innerText = filter === 'unverified' ? "Antrean Masuk" : "Riwayat Masuk";
        }
        renderNota();
    }

    function updateFilterButtons() {
        const btnUnv = document.getElementById('filter-unverified');
        const btnVer = document.getElementById('filter-verified');
        const activeClass = activeCategory === 'Penjualan' ? 'active-penjualan' : 'active-pembelian';
        btnUnv.classList.remove('active-penjualan', 'active-pembelian');
        btnVer.classList.remove('active-penjualan', 'active-pembelian');
        if (statusFilter === 'unverified') btnUnv.classList.add(activeClass);
        else btnVer.classList.add(activeClass);
    }

    function switchTab(tab) {
        const pageNota = document.getElementById('pageNota');
        const pageGudang = document.getElementById('pageGudang');
        const tabNota = document.getElementById('tabNota');
        const tabGudang = document.getElementById('tabGudang');
        if (tab === 'nota') {
            pageNota.classList.remove('hidden');
            pageGudang.classList.add('hidden');
            tabNota.classList.add('tab-active');
            tabGudang.classList.remove('tab-active');
            tabGudang.classList.add('text-slate-400');
        } else {
            pageNota.classList.add('hidden');
            pageGudang.classList.remove('hidden');
            tabGudang.classList.add('tab-active');
            tabNota.classList.remove('tab-active');
            tabNota.classList.add('text-slate-400');
            renderFisik();
        }
    }

    async function loadVerifiedLogs() {
      try {
        const res = await fetch(`${APPS_SCRIPT_URL}?action=getVerified`);
        const data = await res.json();
        if (Array.isArray(data)) {
            verifiedLogs = data;
            localStorage.setItem('cached_verified_logs', JSON.stringify(data));
        }
      } catch (e) {
        verifiedLogs = JSON.parse(localStorage.getItem('cached_verified_logs') || '[]'); 
      }
    }

    async function loadNota() {
      try {
        const res = await fetch(CSV_URL);
        const text = await res.text();
        const rows = text.split('\n').slice(1);
        listItemsNota = []; 

        rows.forEach((r) => {
          const parts = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
          if (parts.length < 11) return;

          const rawDateStr = parts[1]?.trim(); 
          if(!rawDateStr) return;

          const rowDate = new Date(rawDateStr.replace(' ', 'T'));
          if (isNaN(rowDate.getTime()) || rowDate < START_DATE) return;

          const idTrx = parts[0].trim();
          // Diubah ke parts[8] (Kolom I) atau parts[9] (Kolom J) sesuai kebutuhan pemetaan spreadsheet Anda
          const pelanggan = parts[8]?.trim() || "Tanpa Nama"; 
          const kategoriNota = parts[3]?.trim(); 
          let jsonString = parts[10];

          if ((kategoriNota === "Pembelian" || kategoriNota === "Penjualan") && jsonString) {
            try {
              let cleanJson = jsonString.trim();
              if (cleanJson.startsWith('"') && cleanJson.endsWith('"')) cleanJson = cleanJson.substring(1, cleanJson.length - 1);
              cleanJson = cleanJson.replace(/""/g, '"');
              const items = JSON.parse(cleanJson);
              if (Array.isArray(items)) {
                items.forEach((item, itemIdx) => {
                  if (item.kategori === "TTH") return;
                  listItemsNota.push({
                    uniqueId: `N-${idTrx}-${itemIdx}`,
                    idTrx: idTrx, tgl: rawDateStr.split(' ')[0],
                    namaItem: item.nama || "Item",
                    qty: parseInt(item.qty || 0),
                    kategori: kategoriNota,
                    pelanggan: pelanggan
                  });
                });
              }
            } catch (e) {}
          }
        });
        renderNota();
      } catch (e) {}
    }

    async function loadFisik() {
      try {
        const { data } = await _supabase
            .from('riwayat')
            .select('*')
            .gte('created_at', START_DATE.toISOString())
            .order('created_at', { ascending: false });
        listFisik = data || [];
        renderFisik();
      } catch (e) {}
    }

    function calculateVerifiedQtyForNota(notaId) {
        return verifiedLogs
            .filter(log => String(log.notaId) === String(notaId))
            .reduce((sum, log) => sum + parseInt(log.qtyNota || 0), 0);
    }

    function calculateRemainingStock(fisikId, initialQty) {
        const usedAmount = verifiedLogs
            .filter(log => String(log.fisikId) === String(fisikId))
            .reduce((sum, log) => sum + parseInt(log.qtyNota || 0), 0);
        return initialQty - usedAmount;
    }

    function handleSearch() {
      searchTerm = document.getElementById('searchInput').value.toLowerCase();
      renderNota();
      renderFisik();
    }

    function toggleBulkSelect(id) {
        if (selectedBulkIds.has(id)) selectedBulkIds.delete(id);
        else selectedBulkIds.add(id);
        updateBulkUI();
        renderNota();
    }

    function updateBulkUI() {
        const bar = document.getElementById('bulkActionBar');
        const count = document.getElementById('bulkCount');
        const btnAll = document.getElementById('btnSelectAll');
        const bulkLabel = document.getElementById('bulkLabel');
        const btnBulk = document.getElementById('btnBulkAction');

        if (selectedBulkIds.size > 0) {
            bar.classList.remove('hidden');
            count.innerText = selectedBulkIds.size;
            btnAll.innerText = "Batal";
            const activeColor = activeCategory === 'Penjualan' ? 'indigo' : 'orange';
            count.className = `w-10 h-10 bg-${activeColor}-500 rounded-xl flex items-center justify-center font-black text-lg`;
            btnBulk.className = `bg-${activeColor}-600 px-6 py-2.5 rounded-xl font-black text-xs uppercase tracking-widest`;
            bulkLabel.innerText = activeCategory === 'Penjualan' ? "Verifikasi Stok Keluar" : "Verifikasi Stok Masuk";
        } else {
            bar.classList.add('hidden');
            btnAll.innerText = "Pilih Semua";
        }
    }

    function toggleSelectAll() {
        const filtered = listItemsNota.filter(n => {
            if (n.kategori !== activeCategory) return false;
            const verifiedQty = calculateVerifiedQtyForNota(n.uniqueId);
            const isFullyVerified = verifiedQty >= n.qty;
            if (statusFilter === 'unverified') return !isFullyVerified;
            if (statusFilter === 'verified') return isFullyVerified;
            return true;
        });

        if (selectedBulkIds.size === filtered.length && filtered.length > 0) {
            selectedBulkIds.clear();
        } else {
            filtered.forEach(n => {
                const verifiedQty = calculateVerifiedQtyForNota(n.uniqueId);
                if (verifiedQty < n.qty) selectedBulkIds.add(n.uniqueId);
            });
        }
        updateBulkUI();
        renderNota();
    }

    function renderNota() {
      const container = document.getElementById('containerNota');
      const filtered = listItemsNota.filter(n => {
        if (n.kategori !== activeCategory) return false;
        const verifiedQty = calculateVerifiedQtyForNota(n.uniqueId);
        const isFullyVerified = verifiedQty >= n.qty;
        let passFilter = true;
        if (statusFilter === 'unverified') passFilter = !isFullyVerified;
        else if (statusFilter === 'verified') passFilter = isFullyVerified;
        const passSearch = (n.namaItem || "").toLowerCase().includes(searchTerm) || 
                           (n.pelanggan || "").toLowerCase().includes(searchTerm) ||
                           (n.idTrx || "").toLowerCase().includes(searchTerm);
        return passFilter && passSearch;
      });

      document.getElementById('countNota').innerText = filtered.length;
      if(filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-20 text-slate-300 italic text-xs">Tidak ada data transaksi sejak 23 April 2026.</div>`;
        return;
      }

      container.innerHTML = filtered.map(n => {
        const verifiedQty = calculateVerifiedQtyForNota(n.uniqueId);
        const isFullyVerified = verifiedQty >= n.qty;
        const isBulkSelected = selectedBulkIds.has(n.uniqueId);
        const activeColor = activeCategory === 'Penjualan' ? 'indigo' : 'orange';
        
        let cardClass = `bg-white p-4 rounded-2xl border border-slate-100 shadow-sm animate-in transition-all relative`;
        if (isFullyVerified) cardClass += " opacity-60 grayscale-[0.5]";
        if (isBulkSelected) cardClass += ` border-${activeColor}-500 ring-2 ring-${activeColor}-500/20 bg-${activeColor}-50/30`;

        return `
          <div class="${cardClass}">
            <div class="flex justify-between items-start mb-2">
              <div class="flex gap-2 items-center">
                ${!isFullyVerified ? `
                  <div onclick="toggleBulkSelect('${n.uniqueId}')" class="custom-checkbox ${isBulkSelected ? (activeCategory === 'Penjualan' ? 'active' : 'active-pembelian') : ''} mr-1">
                    <i class="fas fa-check"></i>
                  </div>
                ` : ''}
                <span class="text-[8px] font-black uppercase text-slate-400 tracking-tighter">${n.idTrx}</span>
              </div>
              ${isFullyVerified ? 
                '<span class="text-[9px] font-black text-emerald-600 uppercase"><i class="fas fa-check-circle"></i> Terverifikasi</span>' : 
                `<span class="text-[8px] font-bold text-slate-400 uppercase">${n.tgl}</span>`
              }
            </div>
            <div onclick="${isFullyVerified ? '' : `openSmartVerify('${n.uniqueId}')`}" class="cursor-pointer">
                <div class="font-extrabold text-slate-800 text-sm">${n.namaItem}</div>
                <div class="flex justify-between items-end mt-3">
                  <div class="text-[9px] font-bold text-slate-400 uppercase truncate max-w-[150px]">${n.pelanggan}</div>
                  <div class="text-lg font-black text-${activeColor}-600">
                    ${n.qty} <span class="text-[9px]">pcs</span>
                  </div>
                </div>
            </div>
          </div>
        `;
      }).join('') + '<div class="h-40"></div>';
    }

    function renderFisik() {
      const container = document.getElementById('containerFisik');
      const targetType = activeCategory === 'Penjualan' ? 'Barang Keluar' : 'Barang Masuk';

      const items = listFisik.filter(f => {
        const passSearch = (f.nama_barang || "").toLowerCase().includes(searchTerm);
        const passType = f.jenis === targetType;
        return passSearch && passType;
      });
      
      document.getElementById('countFisik').innerText = items.length;

      if(items.length === 0) {
          container.innerHTML = `<div class="text-center py-20 text-slate-300 italic text-xs">Tidak ada log ${targetType.toLowerCase()} sejak 23 April 2026.</div>`;
          return;
      }

      container.innerHTML = items.map(f => `
        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm animate-in">
          <div class="flex justify-between items-center mb-1 text-[8px] font-black uppercase">
            <span class="${f.jenis === 'Barang Masuk' ? 'text-emerald-500' : 'text-red-400'}">${f.jenis}</span>
            <span class="text-slate-300">#${f.id}</span>
          </div>
          <div class="font-extrabold text-slate-700 text-sm truncate">${f.nama_barang}</div>
          <div class="mt-2 flex justify-between items-center">
             <span class="text-[8px] text-slate-300 font-bold uppercase italic">${new Date(f.created_at).toLocaleDateString('id-ID')}</span>
             <span class="stok-badge" style="background: ${f.jenis === 'Barang Masuk' ? 'linear-gradient(135deg, #f59e0b, #d97706)' : 'linear-gradient(135deg, #6366f1, #4338ca)'}">
                ${calculateRemainingStock(f.id, f.jumlah)} PCS
             </span>
          </div>
        </div>
      `).join('') + '<div class="h-40"></div>';
    }

    let selectedNota = null;
    function openSmartVerify(notaId) {
      selectedNota = listItemsNota.find(n => n.uniqueId === notaId);
      const remaining = selectedNota.qty - calculateVerifiedQtyForNota(selectedNota.uniqueId);
      const header = document.getElementById('vNotaHeader');
      
      const targetType = selectedNota.kategori === 'Penjualan' ? 'Barang Keluar' : 'Barang Masuk';
      
      header.style.backgroundColor = selectedNota.kategori === 'Penjualan' ? "#4f46e5" : "#f59e0b";
      document.getElementById('vNotaName').innerText = selectedNota.namaItem;
      document.getElementById('vNotaQty').innerText = remaining;
      document.getElementById('vNotaDetail').innerText = `${selectedNota.pelanggan} • #${selectedNota.idTrx}`;
      
      const query = (selectedNota.namaItem || "").toLowerCase().split(' ')[0]; 
      const matches = listFisik.filter(f => f.jenis === targetType && (f.nama_barang || "").toLowerCase().includes(query));
      
      const listContainer = document.getElementById('matchingFisikList');
      const noMatch = document.getElementById('noMatchMsg');
      
      if (matches.length > 0) {
        noMatch.classList.add('hidden');
        listContainer.innerHTML = matches.map(f => {
            const sisa = calculateRemainingStock(f.id, f.jumlah);
            const activeColor = selectedNota.kategori === 'Penjualan' ? 'indigo' : 'orange';
            return `
              <div onclick="selectFisikItem('${f.id}')" id="modal-fisik-${f.id}" class="p-4 bg-white border border-slate-100 rounded-2xl flex justify-between items-center transition-all active:scale-95">
                <div class="flex-1">
                   <div class="text-[7px] font-black uppercase text-slate-400">#${f.id}</div>
                   <div class="font-extrabold text-slate-700 text-sm">${f.nama_barang}</div>
                </div>
                <div class="text-right">
                    <div class="text-xl font-black text-${activeColor}-600">${sisa}</div>
                    <div class="text-[8px] font-black text-slate-300 uppercase">PCS</div>
                </div>
              </div>
            `;
        }).join('');
      } else {
        listContainer.innerHTML = '';
        noMatch.classList.remove('hidden');
      }
      document.getElementById('modalVerify').classList.remove('hidden');
      setTimeout(() => document.getElementById('modalContent').classList.remove('translate-y-full'), 10);
    }

    let selectedFisik = null;
    function selectFisikItem(id) {
        selectedFisik = listFisik.find(f => f.id == id);
        const btn = document.getElementById('btnAction');
        btn.disabled = false;
        btn.className = "w-full py-4 bg-slate-900 text-white font-black rounded-2xl uppercase text-sm shadow-lg";
        btn.innerText = "Gunakan Log #" + id;
    }

    function closeModal() {
      document.getElementById('modalContent').classList.add('translate-y-full');
      setTimeout(() => document.getElementById('modalVerify').classList.add('hidden'), 300);
    }

    async function submitVerifikasi() {
      const btn = document.getElementById('btnAction');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner animate-spin"></i>';
      document.getElementById('syncStatus').classList.remove('hidden');
      const payload = {
        action: "verifyOne",
        notaId: selectedNota.uniqueId,
        fisikId: String(selectedFisik.id),
        namaItem: selectedNota.namaItem,
        qtyNota: selectedNota.qty,
        qtyFisik: selectedFisik.jumlah,
        status: "Surplus",
        pelanggan: selectedNota.pelanggan
      };
      try {
        await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
        verifiedLogs.push(payload);
        closeModal();
        renderNota();
        renderFisik();
        document.getElementById('syncStatus').classList.add('hidden');
      } catch (e) {
        btn.innerText = "Gagal";
      }
    }

    async function submitBulkVerifikasi() {
        const batchData = Array.from(selectedBulkIds).map(id => {
            const n = listItemsNota.find(item => item.uniqueId === id);
            return {
                notaId: n.uniqueId,
                fisikId: "MASS_VERIFY",
                namaItem: n.namaItem,
                qtyNota: n.qty,
                qtyFisik: n.qty,
                status: "Surplus",
                pelanggan: n.pelanggan
            };
        });
        document.getElementById('syncStatus').classList.remove('hidden');
        try {
            await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "verifyBulk", data: batchData }) });
            batchData.forEach(item => verifiedLogs.push(item));
            selectedBulkIds.clear();
            updateBulkUI();
            renderNota();
            renderFisik();
            document.getElementById('syncStatus').classList.add('hidden');
        } catch (e) {}
    }

    async function fetchAllData() {
      const icon = document.getElementById('refreshIcon');
      if(icon) icon.classList.add('animate-spin');
      await loadVerifiedLogs();
      await Promise.all([ loadNota(), loadFisik() ]);
      if(icon) icon.classList.remove('animate-spin');
    }

    window.onload = fetchAllData;
  </script>
</body>
</html>
