<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kasir & Arus Kas Modern</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-active { color: #2563eb !important; }
    .nav-active i { transform: translateY(-2px); transition: transform 0.2s; }
    .page-transition { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .loader { border: 2px solid #f3f3f3; border-top: 2px solid #3498db; border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .syncing-overlay {
        position: absolute;
        inset: 0;
        background: rgba(255,255,255,0.7);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        border-radius: inherit;
    }
  </style>
</head>
<body class="max-w-md mx-auto min-h-screen shadow-2xl relative bg-white pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-100 p-4">
        <div class="flex justify-between items-center">
            <div>
                <h1 id="page-title" class="text-xl font-black text-slate-800 tracking-tight text-blue-600 uppercase">NOTA BELANJA</h1>
                <p id="current-date" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Memuat...</p>
            </div>
            <div class="flex gap-2 items-center">
                <div id="sync-indicator" class="hidden"><div class="loader"></div></div>
                <div id="export-container">
                    <button onclick="exportToPDF()" class="p-2.5 bg-blue-50 rounded-2xl text-blue-600 hover:bg-blue-100 transition-colors">
                        <i data-lucide="file-text" class="w-5 h-5"></i>
                    </button>
                </div>
                <button onclick="fetchData()" class="p-2.5 bg-slate-100 rounded-2xl text-slate-600 hover:bg-slate-200 transition-colors">
                    <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <main id="app-content" class="p-4 space-y-6 page-transition">
        <!-- Filter & Search -->
        <div id="search-wrapper" class="space-y-4">
            <div class="relative">
                <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-slate-400">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </div>
                <input 
                    type="text" 
                    id="bm-search-input"
                    oninput="handleBMSearch(this.value)"
                    placeholder="Cari transaksi atau barang..." 
                    class="w-full bg-slate-100 border-none rounded-2xl py-4 pl-12 pr-4 text-xs font-bold text-slate-800 outline-none"
                >
            </div>

            <div class="flex gap-1 bg-slate-100 p-1 rounded-2xl">
                <button onclick="setBMFilter('belum')" id="btn-f-belum" class="flex-1 py-2 text-[10px] font-bold rounded-xl transition-all bg-white shadow-sm text-blue-600 uppercase">Pending</button>
                <button onclick="setBMFilter('selesai')" id="btn-f-selesai" class="flex-1 py-2 text-[10px] font-bold rounded-xl transition-all text-slate-500 uppercase">Selesai</button>
                <button onclick="setBMFilter('semua')" id="btn-f-semua" class="flex-1 py-2 text-[10px] font-bold rounded-xl transition-all text-slate-500 uppercase">Semua</button>
            </div>
        </div>

        <div id="list-container" class="space-y-4"></div>
    </main>

    <!-- Modals -->
    <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0">
        <div id="modal-backdrop" onclick="closeModal()" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm opacity-0 transition-opacity duration-300"></div>
        <div id="modal-content" class="relative bg-white w-full max-w-md rounded-t-[32px] sm:rounded-[32px] shadow-2xl transform translate-y-full transition-transform duration-300 overflow-hidden flex flex-col max-h-[95vh]">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 id="modal-title" class="font-black text-slate-800 uppercase tracking-tight text-xs">Detail</h3>
                <button onclick="closeModal()" class="p-2 bg-white rounded-full shadow-sm text-slate-400">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto flex-1 bg-white"></div>
            <div id="modal-footer" class="p-4 bg-slate-50 border-t border-slate-100 hidden">
                 <button onclick="manualCompletion()" id="btn-manual-comp" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black uppercase text-[10px] shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                    Selesaikan Manual (Bonus)
                 </button>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-lg border-t border-slate-100 px-6 py-4 z-40">
        <div class="flex justify-around items-center max-w-xs mx-auto">
            <button onclick="changeTab('nota_belanja')" id="nav-nota_belanja" class="flex flex-col items-center gap-1 text-slate-400 nav-active">
                <i data-lucide="receipt" class="w-6 h-6"></i>
                <span class="text-[9px] font-bold uppercase tracking-wider">Nota</span>
            </button>
            <button onclick="changeTab('barang_masuk')" id="nav-barang_masuk" class="flex flex-col items-center gap-1 text-slate-400">
                <i data-lucide="package-search" class="w-6 h-6"></i>
                <span class="text-[9px] font-bold uppercase tracking-wider">Stok</span>
            </button>
        </div>
    </nav>

    <div id="custom-alert" class="hidden fixed top-10 left-1/2 -translate-x-1/2 z-[100] w-[90%] max-w-xs p-4 rounded-2xl bg-slate-900 text-white text-[10px] font-bold uppercase tracking-wider text-center shadow-2xl animate-bounce"></div>

    <script>
        const SUPABASE_URL = "https://zqxeoveanevsvynptckm.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxeGVvdmVhbmV2c3Z5bnB0Y2ttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyNzUzODEsImV4cCI6MjA4OTg1MTM4MX0.eeIaytpW1wtWPJc2FbhufkDkhONUt9yypTZU4dTVmsM";
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRvAQXltAVp8lnrXXVVPJr1hYEi8cAJrqz182qT23eaiI8t-MoBrEtE7bAAJqKEyKKTig4hpA9DNuQB/pub?gid=2057149863&single=true&output=csv";
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZNmMPh3BM6IU9529KSCzxhEMhZlfvwCmjcl8B2aiyFO_JGsNrf2NJGsWEXtDm6wlWaQ/exec"; 
        const SPREADSHEET_ID = "15qzJ3txkTBYNFc09RWUAr5ZKUa_lQcOHKCThwJ3r0Fk";

        let allTransactions = [];
        let sheetPurchases = [];
        let verifiedItems = [];
        let currentTab = 'nota_belanja';
        let currentBMFilter = 'belum';
        let bmSearchQuery = "";
        let baseRemainingQty = 0;
        let currentContext = null;

        document.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            const dateEl = document.getElementById('current-date');
            if(dateEl) dateEl.innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            fetchData();
        });

        async function fetchData() {
            const indicator = document.getElementById('sync-indicator');
            if(indicator) indicator.classList.remove('hidden');
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/riwayat?select=*`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                const data = await response.json();
                if (Array.isArray(data)) allTransactions = data.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
                
                const csvRes = await fetch(CSV_URL);
                const csvText = await csvRes.text();
                sheetPurchases = parseCSV(csvText);
                
                await fetchVerifiedItems();
                refreshView();
            } catch (err) { console.error(err); } 
            finally { if(indicator) indicator.classList.add('hidden'); }
        }

        async function fetchVerifiedItems() {
            try {
                const res = await fetch(`${APPS_SCRIPT_URL}?spreadsheet_id=${SPREADSHEET_ID}`);
                const result = await res.json();
                verifiedItems = result.data || [];
            } catch (e) { verifiedItems = []; }
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/);
            if (lines.length < 2) return [];
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                if (!line.trim()) continue;
                const row = [];
                let inQuotes = false, val = '';
                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"') { if (inQuotes && line[j+1] === '"') { val += '"'; j++; } else inQuotes = !inQuotes; }
                    else if (char === ',' && !inQuotes) { row.push(val.trim()); val = ''; }
                    else val += char;
                }
                row.push(val.trim());
                if (row[3] && row[3].toLowerCase() === 'pembelian') {
                    result.push({ no_transaksi: row[0], waktu: row[1], keterangan: row[4], keluar: row[6], pelanggan: row[8] || "Umum", itemRaw: row[10] || "[]" });
                }
            }
            return result;
        }

        async function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            const now = new Date().toLocaleString('id-ID');
            const pageMaxWidth = 182; 

            doc.setFontSize(14);
            doc.setTextColor(37, 99, 235);
            doc.setFont(undefined, 'bold');
            doc.text("LAPORAN NOTA BELANJA PENDING", 14, 20);
            
            doc.setFontSize(8);
            doc.setTextColor(100, 116, 139);
            doc.setFont(undefined, 'normal');
            doc.text(`Dicetak pada: ${now}`, 14, 25);

            const pendingNotes = sheetPurchases.filter(p => {
                let items = [];
                try { items = JSON.parse(p.itemRaw); } catch(e) { items = []; }
                return items.length > 0 && items.some(it => !verifiedItems.some(v => v.no_transaksi === p.no_transaksi && v.nama === it.nama));
            });

            if (pendingNotes.length === 0) {
                showAlert("Tidak ada nota pending untuk di-export.");
                return;
            }

            let startY = 35;

            pendingNotes.forEach((p, index) => {
                let items = [];
                try { items = JSON.parse(p.itemRaw); } catch(e) {}

                if (startY > 240) {
                    doc.addPage();
                    startY = 20;
                }

                doc.setDrawColor(226, 232, 240);
                doc.setFillColor(248, 250, 252);
                doc.roundedRect(14, startY - 5, pageMaxWidth, 16, 2, 2, 'FD');

                doc.setFontSize(9);
                doc.setTextColor(30, 41, 59);
                doc.setFont(undefined, 'bold');
                doc.text(`${p.no_transaksi}`, 18, startY + 1);
                
                doc.setFontSize(8);
                doc.setTextColor(37, 99, 235);
                doc.text(`Pelanggan: ${p.pelanggan}`, 18, startY + 6);

                doc.setTextColor(100, 116, 139);
                doc.setFont(undefined, 'normal');
                doc.text(`${p.waktu}`, 145, startY + 1);
                doc.text(`Ket: ${p.keterangan || "-"}`, 145, startY + 6);

                let subtotal = 0;
                const tableData = items.map(it => {
                    const itemTotal = Number(it.qty || 0) * Number(it.harga || 0);
                    subtotal += itemTotal;
                    const v = verifiedItems.find(v => v.no_transaksi === p.no_transaksi && v.nama === it.nama);
                    let status = "PENDING";
                    if(v) status = v.parent_id === "IGNORED" ? "DIABAIKAN" : "VERIFIED";
                    return [it.nama, it.qty, formatRupiah(it.harga || 0), formatRupiah(itemTotal), status];
                });

                doc.autoTable({
                    startY: startY + 13,
                    margin: { left: 14, right: 14 },
                    head: [['Nama Barang', 'Qty', 'Harga Satuan', 'Total', 'Status']],
                    body: tableData,
                    theme: 'grid',
                    styles: { fontSize: 7, cellPadding: 2, font: 'helvetica' },
                    headStyles: { fillColor: [51, 65, 85], textColor: [255, 255, 255], fontStyle: 'bold' },
                    columnStyles: {
                        0: { cellWidth: 70 },
                        1: { cellWidth: 15, halign: 'center' },
                        2: { cellWidth: 32, halign: 'right' },
                        3: { cellWidth: 35, halign: 'right' },
                        4: { cellWidth: 30, halign: 'center' } 
                    },
                    didParseCell: function(data) {
                        if (data.column.index === 4) {
                            if (data.cell.text[0] === 'VERIFIED') data.cell.styles.textColor = [16, 185, 129];
                            if (data.cell.text[0] === 'PENDING') data.cell.styles.textColor = [239, 68, 68];
                        }
                    }
                });

                const finalY = doc.lastAutoTable.finalY;
                doc.setFontSize(8);
                doc.setFont(undefined, 'bold');
                doc.setTextColor(30, 41, 59);
                doc.text(`Subtotal Nota:`, 130, finalY + 6);
                doc.text(`${formatRupiah(subtotal)}`, 166, finalY + 6, { align: 'right' });

                startY = finalY + 18;
            });

            doc.save(`Laporan_Pending_${new Date().getTime()}.pdf`);
            showAlert("PDF Berhasil di-export");
        }

        function refreshView() {
            ['nota_belanja', 'barang_masuk'].forEach(t => {
                const nav = document.getElementById('nav-' + t);
                if (nav) nav.classList.toggle('nav-active', currentTab === t);
            });
            
            const exportContainer = document.getElementById('export-container');
            if (exportContainer) exportContainer.style.display = (currentTab === 'nota_belanja') ? 'block' : 'none';
            
            if (currentTab === 'nota_belanja') renderNotaBelanja();
            else if (currentTab === 'barang_masuk') renderBarangMasuk();
            lucide.createIcons();
        }

        function changeTab(tab) {
            currentTab = tab;
            document.getElementById('page-title').innerText = tab.replace('_', ' ').toUpperCase();
            refreshView();
        }

        function handleBMSearch(val) { bmSearchQuery = val.toLowerCase(); refreshView(); }
        
        function setBMFilter(v) {
            currentBMFilter = v;
            ['belum', 'selesai', 'semua'].forEach(f => {
                const btn = document.getElementById(`btn-f-${f}`);
                if (f === v) btn.classList.add('bg-white', 'shadow-sm', 'text-blue-600');
                else btn.classList.remove('bg-white', 'shadow-sm', 'text-blue-600');
            });
            refreshView();
        }

        function showAlert(msg) {
            const el = document.getElementById('custom-alert');
            el.innerText = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3000);
        }

        function renderNotaBelanja() {
            const container = document.getElementById('list-container');
            const filtered = sheetPurchases.filter(p => {
                let items = []; try { items = JSON.parse(p.itemRaw); } catch(e) { items = []; }
                const matchInItems = items.some(it => it.nama.toLowerCase().includes(bmSearchQuery));
                const matchInHeader = p.no_transaksi.toLowerCase().includes(bmSearchQuery) || p.keterangan.toLowerCase().includes(bmSearchQuery) || p.pelanggan.toLowerCase().includes(bmSearchQuery);
                const isMatch = matchInHeader || matchInItems;
                const allDone = items.length > 0 && items.every(it => verifiedItems.some(v => v.no_transaksi === p.no_transaksi && v.nama === it.nama));
                if (currentBMFilter === 'belum') return isMatch && !allDone;
                if (currentBMFilter === 'selesai') return isMatch && allDone;
                return isMatch;
            });
            if (filtered.length === 0) { container.innerHTML = `<p class="py-20 text-center text-[10px] font-black text-slate-400">Tidak ada data</p>`; return; }
            container.innerHTML = filtered.map(p => {
                let items = []; try { items = JSON.parse(p.itemRaw); } catch(e) {}
                return `
                <div class="bg-white rounded-[32px] border p-5 shadow-sm space-y-4">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">${p.waktu}</p>
                            <h4 class="font-black text-slate-800 text-sm">${p.no_transaksi}</h4>
                            <p class="text-[10px] font-bold text-blue-600 uppercase mt-0.5">${p.pelanggan}</p>
                        </div>
                    </div>
                    <div class="space-y-2">
                        ${items.map(it => {
                            const vRecord = verifiedItems.find(v => v.no_transaksi === p.no_transaksi && v.nama === it.nama);
                            const isV = !!vRecord;
                            const isIgnored = isV && vRecord.parent_id === "IGNORED";
                            const itemDataStr = JSON.stringify({no_transaksi: p.no_transaksi, nama: it.nama, qty: it.qty, harga: it.harga || 0, waktu: p.waktu}).replace(/"/g, '&quot;');
                            return `<div onclick="openStockPicker('${itemDataStr}', ${isV})" class="flex flex-col gap-1 p-3 rounded-2xl bg-slate-50 border cursor-pointer active:scale-95 transition-all hover:border-blue-200 ${isV ? 'border-emerald-100 bg-emerald-50/20' : ''} ${isIgnored ? 'opacity-60' : ''}"><div class="flex justify-between items-center"><span class="text-[10px] font-bold text-slate-700 uppercase truncate pr-4">${it.nama}</span><div class="flex items-center gap-2"><span class="text-[10px] font-black text-slate-500">x${it.qty}</span>${isV ? `<i data-lucide="${isIgnored ? 'eye-off' : 'check-circle'}" class="w-4 h-4 ${isIgnored ? 'text-slate-300' : 'text-emerald-500'}"></i>` : '<i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>'}</div></div></div>`;
                        }).join('')}
                    </div>
                </div>`}).join('');
        }

        async function openStockPicker(itemDataStr, isVerified) {
            if (isVerified) return;
            const itemData = JSON.parse(itemDataStr);
            const body = document.getElementById('modal-body');
            document.getElementById('modal-title').innerText = "Validasi Item";
            document.getElementById('modal-footer').classList.add('hidden');
            document.getElementById('modal-container').classList.remove('hidden');
            setTimeout(() => { document.getElementById('modal-backdrop').style.opacity = '1'; document.getElementById('modal-content').style.transform = 'translateY(0)'; }, 10);
            body.innerHTML = `<div class="flex justify-center py-12"><div class="loader"></div></div>`;
            const listGudang = allTransactions.filter(t => (t.Jenis || t.jenis || "").toString().toUpperCase() === 'BARANG MASUK')
                .map(t => {
                    const id = t.id || t.ID;
                    const vCount = verifiedItems.filter(v => v.transaction_id == id || v.parent_id == id).reduce((acc, curr) => acc + Number(curr.qty || 0), 0);
                    const sisa = Math.max(0, Number(t.jumlah || 0) - vCount);
                    const createdAt = t.created_at ? new Date(t.created_at).toLocaleDateString('id-ID', {day: '2-digit', month: 'short'}) : 'No Date';
                    return { ...t, sisa, realId: id, similarity: getSimilarityScore(itemData.nama, (t.nama_barang || t.Nama_Barang || "")), nama_barang: t.nama_barang || t.Nama_Barang, dateStr: createdAt };
                }).filter(t => t.sisa > 0);
            const recommended = listGudang.filter(g => g.similarity > 0).sort((a, b) => b.similarity - a.similarity);
            const others = listGudang.filter(g => g.similarity === 0).sort((a, b) => a.nama_barang.localeCompare(b.nama_barang));
            
            body.innerHTML = `
            <div class="p-4 bg-indigo-50 border border-indigo-100 rounded-2xl mb-6">
                <div class="flex justify-between items-start mb-1">
                    <p class="text-[8px] font-black text-indigo-400 uppercase">Item Nota Terpilih</p>
                    <p class="text-[8px] font-black text-indigo-300 uppercase">${itemData.waktu}</p>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-xs font-black text-indigo-700 uppercase">${itemData.nama}</span>
                    <span class="bg-indigo-600 text-white px-3 py-1 rounded-xl text-[10px] font-black">x${itemData.qty}</span>
                </div>
            </div>
            <button onclick="ignoreNotaItem('${JSON.stringify(itemData).replace(/"/g, '&quot;')}', this)" class="w-full p-4 border-2 border-dashed border-slate-200 rounded-[24px] flex items-center justify-center gap-3 text-slate-400 mb-6"><i data-lucide="eye-off" class="w-5 h-5"></i><span class="text-[10px] font-black uppercase">Abaikan Item Ini</span></button>
            
            <p class="text-[9px] font-black text-slate-400 uppercase mb-3 ml-2">Pilih Stok Masuk (Tujuan)</p>
            ${recommended.map(g => `<div onclick="processVerificationFromNota('${g.realId}', '${JSON.stringify(itemData).replace(/"/g, '&quot;')}', this)" class="p-4 border-2 border-blue-100 bg-blue-50/20 rounded-[24px] mb-3 flex justify-between items-center cursor-pointer active:scale-95 transition-all"><div class="flex flex-col gap-1 pr-2"><div class="flex items-center gap-2"><span class="text-[11px] font-black text-slate-800 uppercase truncate">${g.nama_barang}</span><span class="text-[8px] font-black bg-blue-100 text-blue-600 px-1.5 rounded">${g.dateStr}</span></div><span class="text-[8px] font-bold text-slate-400 uppercase">Stok: x${g.sisa}</span></div><i data-lucide="star" class="w-5 h-5 text-blue-500 fill-blue-500"></i></div>`).join('')}
            <div class="space-y-3">${others.map(g => `<div onclick="processVerificationFromNota('${g.realId}', '${JSON.stringify(itemData).replace(/"/g, '&quot;')}', this)" class="p-4 border-2 border-slate-50 rounded-[24px] flex justify-between items-center cursor-pointer active:scale-95 transition-all"><div class="flex flex-col gap-1 pr-2"><div class="flex items-center gap-2"><span class="text-[11px] font-black text-slate-800 uppercase truncate">${g.nama_barang}</span><span class="text-[8px] font-black bg-slate-100 text-slate-500 px-1.5 rounded">${g.dateStr}</span></div><span class="text-[8px] font-bold text-slate-400 uppercase">Stok: x${g.sisa}</span></div><i data-lucide="plus-circle" class="w-5 h-5 text-slate-300"></i></div>`).join('')}</div>`;
            lucide.createIcons();
        }

        async function ignoreNotaItem(itemDataStr, element) {

       function renderBarangMasuk() {
    const container = document.getElementById('list-container');
    const filtered = allTransactions.filter(t => (t.Jenis || t.jenis || "").toString().toUpperCase() === 'BARANG MASUK')
        .map(t => {
            const id = t.id || t.ID;
            const vCount = verifiedItems.filter(v => v.transaction_id == id || v.parent_id == id).reduce((acc, curr) => acc + Number(curr.qty || 0), 0);
            const sisa = Math.max(0, Number(t.jumlah || 0) - vCount);
            
            // Format tanggal untuk tampilan daftar
            const tanggalMasuk = t.created_at ? new Date(t.created_at).toLocaleDateString('id-ID', {
                day: '2-digit', 
                month: 'short', 
                year: 'numeric'
            }) : '-';

            return { ...t, target: Number(t.jumlah || 0), sisa, isLunas: sisa === 0, realId: id, tanggalDisplay: tanggalMasuk };
        }).filter(t => {
            const match = (t.nama_barang || t.Nama_Barang || "").toLowerCase().includes(bmSearchQuery);
            if (currentBMFilter === 'belum') return match && !t.isLunas;
            if (currentBMFilter === 'selesai') return match && t.isLunas;
            return match;
        });

    if (filtered.length === 0) { 
        container.innerHTML = `<p class="py-20 text-center text-[10px] font-black text-slate-400">Data Kosong</p>`; 
        return; 
    }

    container.innerHTML = `<div class="bg-white rounded-[32px] border divide-y divide-slate-50">${filtered.map(t => `
        <div onclick="showDetailGudang('${(t.nama_barang || t.Nama_Barang).replace(/'/g, "\\'")}', '${t.target}', '${t.realId}', '${t.created_at || ''}')" class="p-5 flex justify-between items-center cursor-pointer active:bg-slate-50 transition-colors">
            <div>
                <p class="text-[8px] font-bold text-slate-400 uppercase tracking-tighter mb-0.5">${t.tanggalDisplay}</p>
                <h4 class="font-black text-sm text-slate-800 uppercase">${t.nama_barang || t.Nama_Barang}</h4>
                <div class="flex gap-2 mt-1">
                    <span class="text-[10px] font-bold text-slate-400 uppercase">Total x${t.target}</span>
                    ${!t.isLunas ? `<span class="bg-orange-50 text-orange-600 text-[10px] font-black px-2 rounded-lg">Sisa x${t.sisa}</span>` : '<span class="bg-emerald-50 text-emerald-600 text-[10px] font-black px-2 rounded-lg">Selesai</span>'}
                </div>
            </div>
            <i data-lucide="chevron-right" class="w-5 h-5 text-slate-200"></i>
        </div>`).join('')}</div>`;
    lucide.createIcons();
}

        async function showDetailGudang(name, qty, id, createdAt) {
            const body = document.getElementById('modal-body'); currentContext = { name, qty, id };
            const formattedDate = createdAt ? new Date(createdAt).toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'}) : 'Tidak Ada Tanggal';
            
            document.getElementById('modal-title').innerText = "Validasi Stok";
            document.getElementById('modal-container').classList.remove('hidden');
            setTimeout(() => { document.getElementById('modal-backdrop').style.opacity = '1'; document.getElementById('modal-content').style.transform = 'translateY(0)'; }, 10);
            body.innerHTML = `<div class="flex justify-center py-12"><div class="loader"></div></div>`;
            await fetchVerifiedItems();
            const currentVerified = verifiedItems.filter(v => v.transaction_id == id || v.parent_id == id);
            baseRemainingQty = Math.max(0, Number(qty) - currentVerified.reduce((acc, curr) => acc + Number(curr.qty || 0), 0));
            body.innerHTML = `
            <div class="p-5 bg-slate-900 rounded-[28px] text-white mb-6 text-center">
                <p class="text-[9px] font-black opacity-40 uppercase mb-1">Stok Masuk: ${formattedDate}</p>
                <div class="flex justify-center items-center gap-4"><h4 class="text-lg font-black uppercase truncate">${name}</h4><div class="bg-blue-600 px-4 py-2 rounded-2xl text-xs font-black">x${baseRemainingQty}</div></div>
            </div>
            ${currentVerified.length > 0 ? `<div class="mb-6 space-y-2">${currentVerified.map(v => `<div class="flex justify-between items-center p-3 bg-emerald-50/50 border border-emerald-100 rounded-2xl"><div><div class="flex items-center gap-2"><p class="text-[8px] font-black text-emerald-400 uppercase">${v.no_transaksi}</p><p class="text-[8px] font-black text-slate-400 uppercase">${v.waktu}</p></div><p class="text-[10px] font-bold text-emerald-700 uppercase">${v.nama}</p></div><span class="text-[10px] font-black text-emerald-600">x${v.qty}</span></div>`).join('')}</div>` : ''}
            
            <p class="text-[9px] font-black text-slate-400 uppercase mb-3 ml-2">Pilih Item Nota (Asal)</p>
            <div id="nota-list" class="space-y-4"></div>`;
            document.getElementById('modal-footer').classList.toggle('hidden', baseRemainingQty <= 0);
            const searchKey = name.toLowerCase().split(' ')[0];
            const matchingPurchases = sheetPurchases.filter(p => p.itemRaw.toLowerCase().includes(searchKey));
            let itemsList = [];
            matchingPurchases.forEach(p => {
                let parsed = []; try { parsed = JSON.parse(p.itemRaw); } catch(e) {}
                parsed.forEach(it => { if (getSimilarityScore(name, it.nama) > 0 && !verifiedItems.some(v => v.no_transaksi === p.no_transaksi && v.nama === it.nama)) itemsList.push({ ...it, no_transaksi: p.no_transaksi, waktu: p.waktu }); });
            });
            const list = document.getElementById('nota-list');
            if(itemsList.length === 0) list.innerHTML = `<p class="py-8 text-center text-[10px] font-bold text-slate-300 uppercase">Tidak ada nota terkait</p>`;
            else list.innerHTML = itemsList.map(it => `<div onclick="handleItemClickFromModal(this, '${JSON.stringify({parent_id: id, no_transaksi: it.no_transaksi, nama: it.nama, qty: it.qty, harga: it.harga || 0, waktu: it.waktu}).replace(/"/g, '&quot;')}')" class="p-4 border border-slate-100 rounded-[28px] flex justify-between items-center cursor-pointer transition-all"><div><div class="flex items-center gap-2 mb-0.5"><p class="text-[9px] font-bold text-slate-400 uppercase">${it.no_transaksi}</p><p class="text-[8px] font-black bg-slate-50 text-slate-400 px-1 rounded">${it.waktu}</p></div><span class="text-[11px] font-bold uppercase text-slate-700 block">${it.nama}</span></div><span class="text-[11px] font-black text-slate-500">x${it.qty}</span></div>`).join('');
            lucide.createIcons();
        }

        async function handleItemClickFromModal(element, dataStr) {
            const data = JSON.parse(dataStr);
            if (baseRemainingQty < Number(data.qty)) { showAlert(`Stok kurang`); return; }
            const overlay = document.createElement('div'); overlay.className = 'syncing-overlay'; overlay.innerHTML = `<div class="loader"></div>`;
            element.classList.add('relative'); element.appendChild(overlay);
            try {
                await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'add_verified_items', spreadsheet_id: SPREADSHEET_ID, items: [{ ...data, transaction_id: String(data.parent_id) }] }) });
                verifiedItems.push({ ...data, transaction_id: String(data.parent_id) }); showAlert("Berhasil!"); closeModal(); fetchData();
            } catch (e) { if (overlay) overlay.remove(); }
        }

        async function manualCompletion() {
            const btn = document.getElementById('btn-manual-comp'); btn.disabled = true; btn.innerHTML = '<div class="loader mx-auto"></div>';
            try {
                await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'add_verified_items', spreadsheet_id: SPREADSHEET_ID, items: [{ parent_id: String(currentContext.id), transaction_id: String(currentContext.id), no_transaksi: "MANUAL", nama: currentContext.name + " (Adj)", qty: baseRemainingQty, harga: 0, waktu: new Date().toISOString() }] }) });
                showAlert("Selesai!"); closeModal(); fetchData();
            } catch (e) { btn.disabled = false; btn.innerHTML = 'Gagal'; }
        }

        function closeModal() {
            const backdrop = document.getElementById('modal-backdrop'); const content = document.getElementById('modal-content');
            if(backdrop) backdrop.style.opacity = '0'; if(content) content.style.transform = 'translateY(100%)';
            setTimeout(() => { document.getElementById('modal-container').classList.add('hidden'); }, 300);
        }

        function formatRupiah(n) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(Math.abs(n)); }
        function getSimilarityScore(a, b) { 
            a = a.toLowerCase(); b = b.toLowerCase();
            if (a === b) return 100;
            if (a.includes(b) || b.includes(a)) return 80;
            return 0;
        }
    </script>
