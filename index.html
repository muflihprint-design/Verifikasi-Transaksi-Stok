<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kasir & Arus Kas Modern</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-active { color: #2563eb !important; }
    .nav-active i { transform: translateY(-2px); transition: transform 0.2s; }
    .page-transition { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    #modal-backdrop { transition: opacity 0.3s ease; }
    #modal-content { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }

    .item-checkbox:checked + .checkbox-visual {
      background-color: #2563eb;
      border-color: #2563eb;
    }
    .item-checkbox:checked + .checkbox-visual i {
      display: block;
    }
  </style>
</head>
<body class="max-w-md mx-auto min-h-screen shadow-2xl relative bg-white pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-100 p-4">
        <div class="flex justify-between items-center">
            <div>
                <h1 id="page-title" class="text-xl font-black text-slate-800 tracking-tight text-blue-600 uppercase">BERANDA</h1>
                <p id="current-date" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Memuat tanggal...</p>
            </div>
            <div class="flex gap-2">
                <div id="sync-indicator" class="hidden"><div class="loader"></div></div>
                <button onclick="fetchData()" class="p-2.5 bg-slate-100 rounded-2xl text-slate-600 hover:bg-slate-200 transition-colors">
                    <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <main id="app-content" class="p-4 space-y-6 page-transition">
        <!-- Tab: Beranda -->
        <div id="dashboard-container" class="space-y-4">
            <div class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-[32px] p-6 text-white shadow-xl relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full -mr-16 -mt-16 blur-2xl"></div>
                <p class="text-[10px] font-bold opacity-80 uppercase tracking-[0.2em] mb-1">Total Saldo Tunai</p>
                <h2 id="total-saldo" class="text-3xl font-black tracking-tight mb-4">Rp 0</h2>
                <div class="flex gap-4">
                    <div class="flex-1 bg-white/10 backdrop-blur-sm rounded-2xl p-3">
                        <p class="text-[9px] font-bold opacity-70 uppercase mb-1">Masuk</p>
                        <p id="total-masuk" class="text-sm font-bold">Rp 0</p>
                    </div>
                    <div class="flex-1 bg-white/10 backdrop-blur-sm rounded-2xl p-3">
                        <p class="text-[9px] font-bold opacity-70 uppercase mb-1">Keluar</p>
                        <p id="total-keluar" class="text-sm font-bold text-red-200">Rp 0</p>
                    </div>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4 mt-6">
                <button onclick="changeTab('barang_masuk')" class="flex flex-col items-center gap-2 p-5 bg-orange-50 rounded-[28px] border border-orange-100 group active:scale-95 transition-all">
                    <div class="p-3 bg-orange-500 rounded-2xl text-white shadow-lg shadow-orange-200 group-hover:rotate-12 transition-transform">
                        <i data-lucide="package-check" class="w-6 h-6"></i>
                    </div>
                    <span class="text-[10px] font-black text-orange-700 uppercase tracking-wider">Cek Stok Masuk</span>
                </button>
                <button onclick="changeTab('nota_belanja')" class="flex flex-col items-center gap-2 p-5 bg-indigo-50 rounded-[28px] border border-indigo-100 group active:scale-95 transition-all">
                    <div class="p-3 bg-indigo-600 rounded-2xl text-white shadow-lg shadow-indigo-200 group-hover:-rotate-12 transition-transform">
                        <i data-lucide="receipt" class="w-6 h-6"></i>
                    </div>
                    <span class="text-[10px] font-black text-indigo-700 uppercase tracking-wider">Nota Belanja</span>
                </button>
            </div>
        </div>

        <!-- Wrapper Pencarian & Filter -->
        <div id="search-wrapper" class="hidden space-y-4">
            <div class="relative group">
                <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-blue-500 transition-colors">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </div>
                <input 
                    type="text" 
                    id="bm-search-input"
                    oninput="handleBMSearch(this.value)"
                    placeholder="Cari Barang atau No. Transaksi..." 
                    class="w-full bg-slate-100 border-none rounded-2xl py-4 pl-12 pr-4 text-xs font-bold text-slate-800 placeholder:text-slate-400 focus:ring-2 focus:ring-blue-500/20 transition-all outline-none"
                >
            </div>

            <!-- Tombol Aksi Nota -->
            <div id="nota-actions" class="hidden flex gap-2">
                <button onclick="openAutoVerifModal()" class="flex-1 bg-blue-600 text-white p-3 rounded-2xl font-black text-[10px] uppercase flex items-center justify-center gap-2 shadow-lg shadow-blue-100">
                    <i data-lucide="zap" class="w-4 h-4"></i>
                    Verifikasi Otomatis
                </button>
            </div>

            <div class="flex gap-1 bg-slate-100 p-1 rounded-2xl" id="filter-tabs-wrapper">
                <button onclick="setBMFilter('belum')" id="btn-f-belum" class="flex-1 py-2 text-[10px] font-bold rounded-xl transition-all bg-white shadow-sm text-blue-600 uppercase">Pending</button>
                <button onclick="setBMFilter('selesai')" id="btn-f-selesai" class="flex-1 py-2 text-[10px] font-bold rounded-xl transition-all text-slate-500 uppercase">Selesai</button>
                <button onclick="setBMFilter('semua')" id="btn-f-semua" class="flex-1 py-2 text-[10px] font-bold rounded-xl transition-all text-slate-500 uppercase">Semua</button>
            </div>
        </div>

        <!-- List Container -->
        <div id="list-container" class="hidden space-y-4"></div>
    </main>

    <!-- Modal -->
    <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div id="modal-backdrop" onclick="closeModal()" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm opacity-0"></div>
        <div id="modal-content" class="relative bg-white w-full max-w-md rounded-t-[32px] sm:rounded-[32px] shadow-2xl transform translate-y-full overflow-hidden flex flex-col max-h-[95vh]">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 id="modal-title" class="font-black text-slate-800 uppercase tracking-tight text-xs">Detail Verifikasi</h3>
                <button onclick="closeModal()" class="p-2 bg-white rounded-full shadow-sm hover:bg-slate-100 text-slate-400 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto space-y-4 flex-1"></div>
            
            <div id="modal-footer" class="p-4 bg-white border-t border-slate-100 hidden space-y-3">
                <div id="shortage-option" class="p-3 bg-indigo-50 border border-indigo-100 rounded-2xl flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                        <i data-lucide="check-circle" class="w-5 h-5 text-indigo-600"></i>
                        <div>
                            <p class="text-[10px] text-indigo-800 font-bold uppercase tracking-tight">Pelunasan Manual?</p>
                            <p class="text-[9px] text-indigo-600 leading-tight">Gunakan jika barang sisa tidak ada di nota</p>
                        </div>
                    </div>
                    <button onclick="toggleShortageMode()" id="btn-shortage-mode" class="px-4 py-2 bg-indigo-600 text-white text-[10px] font-black uppercase rounded-xl shadow-md active:scale-95 transition-all">Lunasi Sisa</button>
                </div>
                
                <button id="btn-save-verification" onclick="saveVerifiedItems()" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-black uppercase tracking-widest text-xs shadow-lg shadow-blue-200 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    Simpan Verifikasi
                </button>
            </div>
        </div>
    </div>

    <!-- Navigasi Bawah -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-lg border-t border-slate-100 px-6 py-4 z-40">
        <div class="flex justify-between items-center max-w-xs mx-auto">
            <button onclick="changeTab('beranda')" id="nav-beranda" class="flex flex-col items-center gap-1 text-slate-400 nav-active">
                <i data-lucide="layout-grid" class="w-6 h-6"></i>
                <span class="text-[10px] font-bold uppercase tracking-wider">Mulai</span>
            </button>
            <button onclick="changeTab('nota_belanja')" id="nav-nota_belanja" class="flex flex-col items-center gap-1 text-slate-400">
                <i data-lucide="receipt" class="w-6 h-6"></i>
                <span class="text-[10px] font-bold uppercase tracking-wider">Nota</span>
            </button>
            <button onclick="changeTab('barang_masuk')" id="nav-barang_masuk" class="flex flex-col items-center gap-1 text-slate-400">
                <i data-lucide="package-search" class="w-6 h-6"></i>
                <span class="text-[10px] font-bold uppercase tracking-wider">Cek Stok</span>
            </button>
        </div>
    </nav>

    <script>
        const SUPABASE_URL = "https://zqxeoveanevsvynptckm.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxeGVvdmVhbmV2c3Z5bnB0Y2ttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyNzUzODEsImV4cCI6MjA4OTg1MTM4MX0.eeIaytpW1wtWPJc2FbhufkDkhONUt9yypTZU4dTVmsM";
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRvAQXltAVp8lnrXXVVPJr1hYEi8cAJrqz182qT23eaiI8t-MoBrEtE7bAAJqKEyKKTig4hpA9DNuQB/pub?gid=2057149863&single=true&output=csv";
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZNmMPh3BM6IU9529KSCzxhEMhZlfvwCmjcl8B2aiyFO_JGsNrf2NJGsWEXtDm6wlWaQ/exec"; 
        const SPREADSHEET_ID = "15qzJ3txkTBYNFc09RWUAr5ZKUa_lQcOHKCThwJ3r0Fk";

        let allTransactions = [];
        let sheetPurchases = [];
        let verifiedItems = [];
        let currentTab = 'beranda';
        let currentBMFilter = 'belum';
        let bmSearchQuery = "";
        let selectedItemsForSync = [];
        let baseRemainingQty = 0; 
        let currentTransactionContext = null;
        let isShortageMode = false;

        document.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').innerText = now.toLocaleDateString('id-ID', options);
            fetchData();
        });

        async function fetchData() {
            const indicator = document.getElementById('sync-indicator');
            indicator.classList.remove('hidden');
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/riwayat?select=*`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                const data = await response.json();
                if (Array.isArray(data)) {
                    allTransactions = data.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
                }
                const csvRes = await fetch(CSV_URL);
                const csvText = await csvRes.text();
                sheetPurchases = parseCSV(csvText);
                await fetchVerifiedItems();
                updateDashboard();
                refreshCurrentView();
            } catch (err) { console.error("Gagal Ambil Data:", err); } 
            finally { indicator.classList.add('hidden'); }
        }

        async function fetchVerifiedItems() {
            try {
                const res = await fetch(`${APPS_SCRIPT_URL}?spreadsheet_id=${SPREADSHEET_ID}`);
                const result = await res.json();
                verifiedItems = result.data || [];
            } catch (e) { verifiedItems = []; }
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/);
            if (lines.length < 2) return [];
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                if (!line.trim()) continue;
                const row = [];
                let inQuotes = false, currentValue = '';
                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"') { if (inQuotes && line[j+1] === '"') { currentValue += '"'; j++; } else inQuotes = !inQuotes; }
                    else if (char === ',' && !inQuotes) { row.push(currentValue.trim()); currentValue = ''; }
                    else currentValue += char;
                }
                row.push(currentValue.trim());
                if (row[3] && row[3].toLowerCase() === 'pembelian') {
                    result.push({ no_transaksi: row[0], waktu: row[1], keterangan: row[4], keluar: row[6], itemRaw: row[10] || "[]" });
                }
            }
            return result;
        }

        function refreshCurrentView() {
            ['beranda', 'nota_belanja', 'barang_masuk'].forEach(t => {
                const nav = document.getElementById('nav-' + t);
                if (nav) nav.classList.toggle('nav-active', currentTab === t);
            });
            
            document.getElementById('nota-actions').classList.toggle('hidden', currentTab !== 'nota_belanja');

            if (currentTab === 'nota_belanja') renderNotaBelanja();
            else if (currentTab === 'barang_masuk') renderBarangMasuk();
            lucide.createIcons();
        }

        function updateDashboard() {
            let masuk = 0, keluar = 0;
            allTransactions.forEach(t => { masuk += Number(t.masuk || 0); keluar += Number(t.keluar || 0); });
            document.getElementById('total-masuk').innerText = formatRupiah(masuk);
            document.getElementById('total-keluar').innerText = formatRupiah(keluar);
            document.getElementById('total-saldo').innerText = formatRupiah(masuk - keluar);
        }

        function changeTab(tab) {
            currentTab = tab;
            let title = tab.replace('_', ' ').toUpperCase();
            if (title === "NOTA BELANJA") title = "NOTA PEMBELIAN";
            if (title === "BARANG MASUK") title = "STOK MASUK";
            document.getElementById('page-title').innerText = title;
            document.getElementById('dashboard-container').classList.toggle('hidden', tab !== 'beranda');
            document.getElementById('search-wrapper').classList.toggle('hidden', tab === 'beranda');
            document.getElementById('list-container').classList.toggle('hidden', tab === 'beranda');
            refreshCurrentView();
        }

        function handleBMSearch(val) {
            bmSearchQuery = val.toLowerCase();
            if (currentTab === 'nota_belanja') renderNotaBelanja();
            else renderBarangMasuk();
        }

        function setBMFilter(v) {
            currentBMFilter = v;
            ['belum', 'selesai', 'semua'].forEach(f => {
                const btn = document.getElementById(`btn-f-${f}`);
                if (f === v) btn.classList.add('bg-white', 'shadow-sm', 'text-blue-600');
                else btn.classList.remove('bg-white', 'shadow-sm', 'text-blue-600');
            });
            if (currentTab === 'nota_belanja') renderNotaBelanja();
            else renderBarangMasuk();
        }

        function renderNotaBelanja() {
            const container = document.getElementById('list-container');
            const filtered = sheetPurchases.filter(p => {
                const matchMeta = p.no_transaksi.toLowerCase().includes(bmSearchQuery) || p.keterangan.toLowerCase().includes(bmSearchQuery);
                let rincian = [];
                try { rincian = JSON.parse(p.itemRaw); } catch(e) {}
                const matchItemName = rincian.some(item => item.nama.toLowerCase().includes(bmSearchQuery));
                const isMatchSearch = matchMeta || matchItemName;
                const allVerified = rincian.every(item => verifiedItems.some(v => v.no_transaksi === p.no_transaksi && v.nama === item.nama));
                if (currentBMFilter === 'belum') return isMatchSearch && !allVerified;
                if (currentBMFilter === 'selesai') return isMatchSearch && allVerified;
                return isMatchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-12 text-center text-slate-400 font-bold uppercase text-[10px] tracking-widest">Tidak ada nota ditemukan</div>`;
                return;
            }

            container.innerHTML = `<div class="space-y-4">${filtered.map(p => `
                <div class="bg-white rounded-[32px] border p-5 shadow-sm space-y-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">${p.waktu}</p>
                            <h4 class="font-black text-slate-800 text-sm">${p.no_transaksi}</h4>
                        </div>
                        <span class="bg-indigo-50 text-indigo-600 px-3 py-1 rounded-xl text-[10px] font-black">-${formatRupiah(p.keluar)}</span>
                    </div>
                    <div class="space-y-2">
                        ${JSON.parse(p.itemRaw).map(item => {
                            const isV = verifiedItems.some(v => v.no_transaksi === p.no_transaksi && v.nama === item.nama);
                            return `
                                <div onclick="openVerifFromNota('${item.nama}', '${item.qty}', '${p.no_transaksi}')" class="flex justify-between items-center p-3 rounded-2xl border ${isV ? 'bg-emerald-50 border-emerald-100 opacity-60' : 'bg-slate-50 border-slate-100 active:scale-95'} cursor-pointer">
                                    <span class="text-[11px] font-bold text-slate-700 uppercase truncate pr-4">${item.nama}</span>
                                    <div class="flex items-center gap-2">
                                        <span class="text-[10px] font-black text-slate-500">x${item.qty}</span>
                                        ${isV ? '<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500"></i>' : '<i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>'}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('')}</div>`;
            lucide.createIcons();
        }

        async function openVerifFromNota(itemName, qty, noNota) {
            const body = document.getElementById('modal-body');
            const footer = document.getElementById('modal-footer');
            footer.classList.add('hidden');
            document.getElementById('modal-container').classList.remove('hidden');
            setTimeout(() => { document.getElementById('modal-backdrop').style.opacity = '1'; document.getElementById('modal-content').style.transform = 'translateY(0)'; }, 10);
            body.innerHTML = `<div class="flex flex-col items-center py-16"><div class="loader"></div></div>`;

            const searchTerms = itemName.toLowerCase().split(' ').filter(word => word.length > 2);
            const possibleTargets = allTransactions.filter(t => {
                const j = (t.Jenis || t.jenis || "").toString().toUpperCase();
                if (j !== 'BARANG MASUK') return false;
                const n = (t.nama_barang || t.Nama_Barang || "").toLowerCase();
                return searchTerms.some(term => n.includes(term));
            }).map(t => {
                const id = t.id || t.ID;
                const count = verifiedItems.filter(v => v.parent_id == id || v.transaction_id == id).reduce((acc, curr) => acc + Number(curr.qty), 0);
                return { ...t, target: Number(t.jumlah || 0), sisa: Math.max(0, Number(t.jumlah || 0) - count), realId: id };
            });

            if (possibleTargets.length === 0) {
                body.innerHTML = `<div class="text-center py-10"><p class="text-[10px] font-black text-slate-400">Target Stok Tidak Ditemukan</p></div>`;
                return;
            }

            body.innerHTML = `
                <div class="mb-6"><p class="text-[9px] font-black text-slate-400 uppercase mb-1">Item Dari Nota</p><h3 class="text-lg font-black text-blue-600 uppercase">${itemName} (x${qty})</h3></div>
                <div class="space-y-3">
                    ${possibleTargets.map(t => `
                        <div onclick="showDetailModal('${t.nama_barang || t.Nama_Barang}', '${t.target}', '${t.realId}')" class="p-4 rounded-[28px] border-2 border-slate-100 bg-white hover:border-blue-500 cursor-pointer">
                            <div class="flex justify-between items-center"><h4 class="font-black text-slate-800 text-sm uppercase">${t.nama_barang || t.Nama_Barang}</h4><span class="text-[9px] font-black bg-slate-100 px-2 py-1 rounded-lg">ID: ${t.realId}</span></div>
                            <div class="flex gap-2 mt-2"><div class="bg-blue-50 text-blue-700 px-2 py-1 rounded-lg text-[9px] font-bold">TGT: x${t.target}</div><div class="bg-orange-50 text-orange-700 px-2 py-1 rounded-lg text-[9px] font-bold">SISA: x${t.sisa}</div></div>
                        </div>
                    `).join('')}
                </div>`;
        }

        function openAutoVerifModal() {
            const body = document.getElementById('modal-body');
            const footer = document.getElementById('modal-footer');
            footer.classList.add('hidden');
            document.getElementById('modal-title').innerText = "Verifikasi Otomatis";
            document.getElementById('modal-container').classList.remove('hidden');
            setTimeout(() => { document.getElementById('modal-backdrop').style.opacity = '1'; document.getElementById('modal-content').style.transform = 'translateY(0)'; }, 10);
            
            const today = new Date().toISOString().split('T')[0];
            
            body.innerHTML = `
                <div class="p-4 bg-blue-50 border border-blue-100 rounded-3xl space-y-2">
                    <p class="text-[10px] font-bold text-blue-700 uppercase tracking-tight">Info Fitur</p>
                    <p class="text-[9px] text-blue-600 leading-relaxed">Sistem akan menandai SEMUA item pada nota dalam rentang tanggal yang dipilih sebagai "Terverifikasi" tanpa mencocokkan ke data Barang Masuk.</p>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Dari Tanggal</label>
                        <input type="date" id="av-start-date" value="${today}" class="w-full p-3 bg-slate-100 rounded-2xl text-xs font-bold outline-none border-2 border-transparent focus:border-blue-500">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Sampai Tanggal</label>
                        <input type="date" id="av-end-date" value="${today}" class="w-full p-3 bg-slate-100 rounded-2xl text-xs font-bold outline-none border-2 border-transparent focus:border-blue-500">
                    </div>
                </div>
                <button onclick="executeAutoVerif()" id="btn-execute-av" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-black uppercase text-xs shadow-lg active:scale-95 transition-all">Mulai Verifikasi</button>
            `;
        }

        async function executeAutoVerif() {
            const start = document.getElementById('av-start-date').value;
            const end = document.getElementById('av-end-date').value;
            const btn = document.getElementById('btn-execute-av');
            
            if (!start || !end) return;

            const startDate = new Date(start);
            startDate.setHours(0,0,0,0);
            const endDate = new Date(end);
            endDate.setHours(23,59,59,999);

            // Filter nota yang belum diverifikasi di rentang tsb
            const targetNotas = sheetPurchases.filter(p => {
                const pDate = new Date(p.waktu);
                if (pDate < startDate || pDate > endDate) return false;
                
                // Cek apakah ada item di nota ini yang belum diverifikasi
                let rincian = [];
                try { rincian = JSON.parse(p.itemRaw); } catch(e) {}
                return rincian.some(item => !verifiedItems.some(v => v.no_transaksi === p.no_transaksi && v.nama === item.nama));
            });

            if (targetNotas.length === 0) {
                btn.innerText = "Tidak Ada Nota Baru";
                btn.classList.replace('bg-blue-600', 'bg-slate-400');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<div class="loader mx-auto"></div>`;

            let itemsToSave = [];
            targetNotas.forEach(p => {
                let rincian = [];
                try { rincian = JSON.parse(p.itemRaw); } catch(e) {}
                rincian.forEach(item => {
                    // Hanya tambahkan jika belum terverifikasi
                    if (!verifiedItems.some(v => v.no_transaksi === p.no_transaksi && v.nama === item.nama)) {
                        itemsToSave.push({
                            parent_id: "AUTO-VERIF",
                            transaction_id: "AUTO-VERIF",
                            no_transaksi: p.no_transaksi,
                            nama: item.nama,
                            qty: Number(item.qty),
                            harga: Number(item.harga || 0),
                            waktu: p.waktu,
                            is_auto: true
                        });
                    }
                });
            });

            try {
                await fetch(APPS_SCRIPT_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify({ 
                        action: 'add_verified_items', 
                        spreadsheet_id: SPREADSHEET_ID, 
                        items: itemsToSave 
                    }) 
                });
                
                setTimeout(async () => {
                    closeModal();
                    await fetchData();
                }, 800);
            } catch (e) {
                btn.disabled = false;
                btn.innerText = "Gagal, Coba Lagi";
            }
        }

        function renderBarangMasuk() {
            const container = document.getElementById('list-container');
            const dataBarangMasuk = allTransactions.filter(t => (t.Jenis || t.jenis || "").toString().toUpperCase() === 'BARANG MASUK');
            const processedData = dataBarangMasuk.map(t => {
                const id = t.id || t.ID;
                const target = Number(t.jumlah || 0);
                const count = verifiedItems.filter(v => v.parent_id == id || v.transaction_id == id).reduce((acc, curr) => acc + Number(curr.qty), 0);
                const sisa = Math.max(0, target - count);
                return { ...t, target, sisa, isLunas: sisa === 0, realId: id };
            });

            const filtered = processedData.filter(t => {
                const mSearch = (t.nama_barang || t.Nama_Barang || "").toLowerCase().includes(bmSearchQuery);
                let mStatus = true;
                if (currentBMFilter === 'belum') mStatus = !t.isLunas;
                else if (currentBMFilter === 'selesai') mStatus = t.isLunas;
                return mSearch && mStatus;
            });

            if (filtered.length === 0) { container.innerHTML = `<div class="p-12 text-center text-slate-400 font-bold uppercase text-[10px]">Kosong</div>`; return; }

            container.innerHTML = `<div class="bg-white rounded-[32px] border divide-y divide-slate-50">${filtered.map(t => `
                <div onclick="showDetailModal('${t.nama_barang || t.Nama_Barang}', '${t.target}', '${t.realId}')" class="p-5 flex justify-between items-center cursor-pointer">
                    <div><h4 class="font-black text-sm text-blue-800 uppercase">${t.nama_barang || t.Nama_Barang}</h4><div class="flex gap-2 mt-1"><span class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">Target x${t.target}</span>${!t.isLunas ? `<span class="bg-orange-50 text-orange-600 text-[10px] font-black px-2 rounded-lg">SISA x${t.sisa}</span>` : '<span class="bg-emerald-50 text-emerald-600 text-[10px] font-black px-2 rounded-lg">LUNAS</span>'}</div></div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-slate-300"></i>
                </div>`).join('')}</div>`;
            lucide.createIcons();
        }

        async function showDetailModal(itemName, itemQty, transactionId) {
            const body = document.getElementById('modal-body');
            const footer = document.getElementById('modal-footer');
            currentTransactionContext = { itemName, itemQty, transactionId };
            isShortageMode = false;
            footer.classList.add('hidden');
            selectedItemsForSync = [];
            document.getElementById('modal-title').innerText = "Detail Verifikasi";
            body.innerHTML = `<div class="flex flex-col items-center py-16"><div class="loader"></div></div>`;
            
            await fetchVerifiedItems();
            
            const searchQuery = itemName.toLowerCase().split(' ')[0];
            const filteredPurchases = sheetPurchases.filter(p => p.itemRaw.toLowerCase().includes(searchQuery));
            const count = verifiedItems.filter(v => v.parent_id == transactionId || v.transaction_id == transactionId).reduce((acc, curr) => acc + Number(curr.qty), 0);
            baseRemainingQty = Math.max(0, itemQty - count);
            
            body.innerHTML = `
                <div class="p-5 bg-slate-900 rounded-[28px] text-white mb-6">
                    <p class="text-[9px] font-black opacity-50 uppercase mb-1">Target Gudang (ID: ${transactionId})</p>
                    <div class="flex justify-between items-center"><h4 class="text-lg font-black uppercase truncate mr-4">${itemName}</h4><div id="remaining-qty-display" class="bg-blue-600 px-4 py-2 rounded-2xl text-sm font-black">x${baseRemainingQty}</div></div>
                </div>
                <div id="purchases-list" class="space-y-4"></div>`;

            const listContainer = document.getElementById('purchases-list');
            if (filteredPurchases.length === 0) {
                listContainer.innerHTML = `<div class="py-10 text-center text-[10px] font-bold text-slate-400 bg-slate-50 rounded-3xl border-2 border-dashed">Nota tidak ditemukan</div>`;
            } else {
                listContainer.innerHTML = filteredPurchases.map((p) => {
                    let items = JSON.parse(p.itemRaw).filter(it => it.nama.toLowerCase().includes(searchQuery));
                    if (items.length === 0) return '';
                    return `<div class="p-4 border rounded-[28px] space-y-3"><p class="text-[9px] font-bold text-slate-400 uppercase">${p.no_transaksi}</p>${items.map((it) => {
                        const isUsed = verifiedItems.some(v => v.no_transaksi === p.no_transaksi && v.nama === it.nama);
                        return `<label class="flex justify-between items-center p-3 rounded-2xl bg-slate-50 border ${isUsed ? 'opacity-40' : 'cursor-pointer'}">
                            <div class="flex items-center gap-3"><input type="checkbox" ${isUsed ? 'disabled' : ''} onchange="toggleItemCheck(this, '${JSON.stringify({parent_id: transactionId, no_transaksi: p.no_transaksi, nama: it.nama, qty: it.qty, harga: it.harga || 0, waktu: p.waktu}).replace(/"/g, '&quot;')}')" class="item-checkbox sr-only"><div class="checkbox-visual w-5 h-5 border-2 rounded-lg flex items-center justify-center"><i data-lucide="check" class="w-3 h-3 text-white hidden"></i></div><span class="text-[11px] font-bold uppercase">${it.nama}</span></div><span class="text-[11px] font-black">x${it.qty}</span>
                        </label>`;
                    }).join('')}</div>`;
                }).join('');
            }
            if (baseRemainingQty > 0) footer.classList.remove('hidden');
            lucide.createIcons();
        }

        function toggleItemCheck(el, dataStr) {
            const data = JSON.parse(dataStr);
            if (el.checked) selectedItemsForSync.push(data);
            else selectedItemsForSync = selectedItemsForSync.filter(i => !(i.no_transaksi === data.no_transaksi && i.nama === data.nama));
            const total = selectedItemsForSync.reduce((acc, curr) => acc + Number(curr.qty), 0);
            const sisa = Math.max(0, baseRemainingQty - total);
            document.getElementById('remaining-qty-display').innerText = sisa === 0 ? 'LUNAS' : `x${sisa}`;
            document.getElementById('remaining-qty-display').className = `px-4 py-2 rounded-2xl text-sm font-black ${sisa === 0 ? 'bg-emerald-500' : 'bg-blue-600'}`;
        }

        function toggleShortageMode() {
            isShortageMode = !isShortageMode;
            const btn = document.getElementById('btn-shortage-mode');
            btn.innerText = isShortageMode ? "Batalkan" : "Lunasi Sisa";
            btn.className = isShortageMode ? "px-4 py-2 bg-slate-500 text-white text-[10px] font-black rounded-xl" : "px-4 py-2 bg-indigo-600 text-white text-[10px] font-black rounded-xl";
        }

        async function saveVerifiedItems() {
            if (!currentTransactionContext) return;
            const btn = document.getElementById('btn-save-verification');
            if (selectedItemsForSync.length === 0 && !isShortageMode) return;
            
            btn.disabled = true;
            btn.innerHTML = `<div class="loader"></div>`;
            
            const itemsToSave = selectedItemsForSync.map(item => ({
                parent_id: String(item.parent_id), 
                transaction_id: String(item.parent_id),
                no_transaksi: item.no_transaksi,
                nama: item.nama,
                qty: Number(item.qty),
                harga: Number(item.harga || 0),
                waktu: item.waktu || new Date().toISOString(),
                is_bonus: false
            }));

            if (isShortageMode) {
                const totalSelected = selectedItemsForSync.reduce((acc, curr) => acc + Number(curr.qty), 0);
                const diff = baseRemainingQty - totalSelected;
                if (diff > 0) {
                    itemsToSave.push({
                        parent_id: String(currentTransactionContext.transactionId),
                        transaction_id: String(currentTransactionContext.transactionId),
                        no_transaksi: "MANUAL-ADJUST",
                        nama: currentTransactionContext.itemName + " (Manual)",
                        qty: diff,
                        harga: 0,
                        waktu: new Date().toISOString(),
                        is_adjustment: true
                    });
                }
            }

            try {
                await fetch(APPS_SCRIPT_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify({ 
                        action: 'add_verified_items', 
                        spreadsheet_id: SPREADSHEET_ID, 
                        items: itemsToSave 
                    }) 
                });
                
                setTimeout(async () => {
                    closeModal();
                    await fetchData();
                }, 800);
            } catch (e) { 
                console.error(e);
                btn.disabled = false; 
                btn.innerHTML = "Simpan Ulang"; 
            }
        }

        function closeModal() {
            document.getElementById('modal-backdrop').style.opacity = '0';
            document.getElementById('modal-content').style.transform = 'translateY(100%)';
            setTimeout(() => document.getElementById('modal-container').classList.add('hidden'), 300);
        }

        function formatRupiah(n) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(Math.abs(n)); }
    </script>
</body>
